<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metales</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
:root{
  --dark:#1a1f2e;
  --mid:#2d3447;
  --light:#3d4a6b;
  --accent:#8b9dc3;
  --gold:#c9a84c;
  --gold-l:#e8c96a;
  --silver:#d0d6e0;
  --surface:#f0f2f6;
  --card:#ffffff;
  --border:#c5cad8;
  --text:#1a1f2e;
  --text2:#5a6380;
  --danger:#c0392b;
  --success:#27ae60;
  --warn:#e67e22;
  --yellow-bg:#fffde7;
  --yellow-border:#f9c928;
  --green-bg:#e8f5e9;
  --green-border:#66bb6a;
}
body{background:var(--surface);color:var(--text);min-height:100vh;overflow-x:hidden}

/* LOADING */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--dark) 0%,var(--mid) 60%,var(--light) 100%)}
.loading-logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:var(--dark);margin-bottom:1.5rem}
.loading-text{color:var(--silver);font-size:14px;letter-spacing:1px}

/* LOGIN */
.login-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--dark) 0%,var(--mid) 60%,var(--light) 100%);padding:2rem}
.login-logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:var(--dark);margin-bottom:1.5rem;box-shadow:0 4px 24px rgba(201,168,76,0.4)}
.login-title{color:#fff;font-size:28px;font-weight:600;letter-spacing:2px;margin-bottom:4px}
.login-sub{color:var(--accent);font-size:13px;letter-spacing:1px;margin-bottom:2.5rem}
.login-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);border-radius:16px;padding:2rem;width:100%;max-width:360px}
.login-card label{color:var(--silver);font-size:13px;font-weight:500;display:block;margin-bottom:8px;letter-spacing:.5px}
.login-card input{width:100%;padding:13px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-size:18px;letter-spacing:4px;outline:none;transition:border .2s}
.login-card input:focus{border-color:var(--gold)}
.login-card input::placeholder{color:rgba(255,255,255,0.3);letter-spacing:1px;font-size:14px}
.login-user-preview{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(201,168,76,0.13);border:1px solid rgba(201,168,76,0.25);color:var(--gold-l);font-size:14px;font-weight:500;min-height:44px;display:flex;align-items:center;gap:8px}
.login-btn{margin-top:1.5rem;width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-l));border:none;font-size:16px;font-weight:600;color:var(--dark);cursor:pointer;letter-spacing:.5px;transition:opacity .2s}
.login-btn:hover{opacity:.88}
.login-btn:disabled{opacity:.4;cursor:not-allowed}
.login-error{margin-top:12px;color:#f87171;font-size:13px;text-align:center}

/* APP SHELL */
.app{display:none;flex-direction:column;min-height:100vh}
.header{background:linear-gradient(90deg,var(--dark),var(--mid));padding:0 1.25rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.25)}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--dark)}
.header-title{color:#fff;font-size:18px;font-weight:600;letter-spacing:1.5px}
.header-user{color:var(--accent);font-size:12px;text-align:right}
.header-user span{display:block;color:var(--gold-l);font-weight:500;font-size:13px}
.logout-btn{background:none;border:1px solid rgba(255,255,255,0.15);color:var(--silver);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;margin-left:10px}
.logout-btn:hover{background:rgba(255,255,255,0.08)}

/* TABS */
.tabs{background:var(--mid);display:flex;border-bottom:2px solid var(--gold)}
.tab{flex:1;padding:13px 4px 11px;text-align:center;color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;letter-spacing:.5px;transition:all .2s;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:18px;height:18px;opacity:.7}
.tab.active{color:var(--gold-l);border-bottom-color:var(--gold)}
.tab.active svg{opacity:1}
.tab:hover{background:rgba(255,255,255,0.05)}

.content{flex:1;padding:1rem;max-width:800px;margin:0 auto;width:100%}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* DATE HERO */
.date-hero{text-align:center;padding:1rem 1rem .25rem}
.date-dayname{font-size:22px;font-weight:600;color:var(--gold);text-transform:capitalize}
.date-day-num{font-size:60px;font-weight:700;line-height:1;color:var(--dark)}
.date-info{font-size:15px;color:var(--text2);margin-top:2px}

/* DATE SELECTOR */
.date-selector{display:flex;gap:6px;overflow-x:auto;padding:10px 1rem 6px;scrollbar-width:none}
.date-selector::-webkit-scrollbar{display:none}
.date-chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;text-align:center}
.date-chip.active{background:var(--dark);color:var(--gold-l);border-color:var(--dark)}
.date-chip .chip-day{font-size:11px;display:block;opacity:.7}
.date-chip .chip-num{font-size:17px;font-weight:700;display:block}

/* TASK ITEMS */
.task-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);margin-bottom:8px;background:#fff;transition:background .2s,border .2s}
.task-item.visto{background:var(--yellow-bg);border-color:var(--yellow-border)}
.task-item.realizado{background:var(--green-bg);border-color:var(--green-border)}

.task-time{font-size:14px;font-weight:700;color:var(--dark);min-width:44px;padding-top:2px;text-align:center}
.task-body{flex:1;min-width:0}
.task-client{font-weight:600;font-size:14px;color:var(--dark)}
.task-details{font-size:12px;color:var(--text2);margin-top:3px}
.task-meta{font-size:11px;color:var(--accent);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.task-meta-badge{background:rgba(139,157,195,0.12);padding:2px 7px;border-radius:10px}

.task-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.task-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;background:#fff;transition:all .15s}
.task-btn:hover{opacity:.8}
.task-btn.visto-btn{border-color:var(--yellow-border);background:#fffde7}
.task-btn.visto-btn.active{background:var(--yellow-border);border-color:var(--yellow-border)}
.task-btn.realizado-btn{border-color:var(--green-border);background:#e8f5e9}
.task-btn.realizado-btn.active{background:var(--success);border-color:var(--success)}

/* SECTION LABELS */
.section-label{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;padding:10px 0 6px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* VEHICLES */
.vehicle-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:10px}
.vehicle-card.alerta-vtv,.vehicle-card.alerta-aceite{border-left:4px solid var(--danger)}
.vehicle-plate{font-size:20px;font-weight:800;color:var(--dark);letter-spacing:3px;font-family:monospace}
.vehicle-model{font-size:13px;color:var(--text2);margin-top:2px}
.vehicle-meta{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.vehicle-meta-item{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border)}
.vehicle-meta-item.alerta{background:#fde8e8;border-color:var(--danger);color:var(--danger);font-weight:600}
.vehicle-meta-item strong{color:var(--text);font-weight:600}
.vehicle-meta-item.alerta strong{color:var(--danger)}
.obs-log{margin-top:10px;border-top:1px solid #eee;padding-top:10px}
.obs-entry{font-size:12px;padding:7px 10px;background:var(--surface);border-radius:7px;margin-bottom:5px;border-left:3px solid var(--gold)}
.obs-entry-date{font-weight:600;color:var(--gold);margin-right:5px}
.add-obs-btn{font-size:12px;color:var(--gold);background:none;border:1px dashed var(--gold);padding:5px 12px;border-radius:8px;cursor:pointer;margin-top:6px}

/* FORMS & MODALS */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:300;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:600;color:var(--dark);margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);line-height:1}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--text2);display:block;margin-bottom:5px;letter-spacing:.3px}
.form-input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;color:var(--text);outline:none;background:#fff;transition:border .2s}
.form-input:focus{border-color:var(--gold)}
.form-select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;color:var(--text);outline:none;background:#fff;transition:border .2s;appearance:none}
.form-select:focus{border-color:var(--gold)}
.form-btn{width:100%;padding:13px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-l));border:none;font-size:15px;font-weight:600;color:var(--dark);cursor:pointer;margin-top:6px}
.form-btn:hover{opacity:.9}
.form-btn:disabled{opacity:.5;cursor:not-allowed}

.client-suggestions{border:1.5px solid var(--border);border-radius:9px;background:#fff;margin-top:-10px;margin-bottom:14px;overflow:hidden;display:none;max-height:200px;overflow-y:auto}
.client-sugg-item{padding:10px 13px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.client-sugg-item:last-child{border-bottom:none}
.client-sugg-item:hover{background:var(--surface)}
.client-sugg-name{font-weight:600;color:var(--dark)}
.client-sugg-detail{font-size:11px;color:var(--text2);margin-top:1px}

.add-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gold);background:none;border:1.5px dashed var(--gold);padding:9px 16px;border-radius:9px;cursor:pointer;width:100%;justify-content:center;margin-top:8px}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text2);font-size:14px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,0.2);border-top-color:var(--dark);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* FAB */
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));border:none;font-size:28px;color:var(--dark);cursor:pointer;box-shadow:0 4px 16px rgba(201,168,76,0.5);z-index:200;display:none;align-items:center;justify-content:center;transition:transform .15s}
.fab:hover{transform:scale(1.07)}

/* Realizado section collapsible */
.realizados-section{margin-top:6px}
.realizados-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 0;color:var(--success);font-size:13px;font-weight:600;user-select:none}
.realizados-toggle svg{width:16px;height:16px;transition:transform .2s}
.realizados-toggle.open svg{transform:rotate(90deg)}
.realizados-list{display:none}
.realizados-list.open{display:block}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">M</div>
  <div class="loading-text">Conectando...</div>
</div>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-logo">M</div>
  <div class="login-title">METALES</div>
  <div class="login-sub">SISTEMA DE GESTIÓN INTERNA</div>
  <div class="login-card">
    <label>Ingresá tu DNI</label>
    <input type="number" id="dniInput" placeholder="Ej: 38530754" oninput="handleDni(this.value)">
    <div class="login-user-preview" id="userPreview">
      <span id="userPreviewText" style="color:rgba(255,255,255,0.35)">Ingresá tu DNI para continuar</span>
    </div>
    <button class="login-btn" id="loginBtn" disabled onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appMain">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">M</div>
      <div class="header-title">METALES</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <div class="header-user"><span id="headerName">-</span><span id="headerRole" style="font-size:11px">-</span></div>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('tareas')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/></svg>
      Tareas
    </div>
    <div class="tab" onclick="switchTab('vehiculos')">

      Vehículos
    </div>
  </div>

  <div id="notifBanner" style="display:none;background:#c0392b;color:#fff;padding:10px 16px;font-size:13px;font-weight:600;text-align:center;cursor:pointer" onclick="cerrarBanner()"></div>

  <div class="content">

    <div id="tab-tareas">

      </div>
      <div class="date-selector" id="dateSelector"></div>
      <div id="taskContainer"></div>

    <div id="tab-vehiculos" style="display:none">

      <button class="add-btn" onclick="openModal('vehiculoModal')">+ Agregar vehículo</button>
    </div>
  </div>
</div>

<button class="fab" id="fabBtn" onclick="openModal('tareaModal')">+</button>

<!-- MODAL TAREA -->
<div class="modal-bg" id="tareaModal">
<div class="modal">
  <div class="modal-title">Nueva Tarea <button class="modal-close" onclick="closeModal('tareaModal')">×</button></div>
  <div class="form-group">
    <label class="form-label">Cliente</label>
    <input class="form-input" id="tareaCliente" placeholder="Escribí 3+ letras..." oninput="buscarCliente(this.value)" autocomplete="off">
    <div class="client-suggestions" id="clientSuggestions"></div>
  </div>
  <div class="form-group">
    <label class="form-label">Fecha de la tarea</label>
    <input class="form-input" id="tareaFecha" type="date">
  </div>
  <div class="form-group">
    <label class="form-label">Horario</label>
    <select class="form-select" id="tareaHorarioTipo" onchange="toggleHorarioInput()">
      <option value="inmediato">⚡ Inmediatamente</option>
      <option value="hora">Hora específica</option>
    </select>
    <input class="form-input" id="tareaHorario" type="time" style="margin-top:8px;display:none">
  </div>
  <div class="form-group">
    <label class="form-label">Vehículo</label>
    <select class="form-select" id="tareaVehiculo"><option value="">— Sin vehículo —</option></select>
  </div>
  <div class="form-group">
    <label class="form-label">¿Con sobre?</label>
    <select class="form-select" id="tareaSobre" onchange="toggleMonto()">
      <option value="no">Sin sobre</option>
      <option value="si">Con sobre</option>
    </select>
  </div>
  <div class="form-group" id="montoGroup" style="display:none">
    <label class="form-label">Monto del sobre</label>
    <input class="form-input" id="tareaMonto" type="number" placeholder="0">
  </div>
  <button class="form-btn" id="btnGuardarTarea" onclick="guardarTarea()">Guardar tarea</button>
</div>
</div>

<!-- MODAL VEHICULO -->
<div class="modal-bg" id="vehiculoModal">
<div class="modal">
  <div class="modal-title">Nuevo Vehículo <button class="modal-close" onclick="closeModal('vehiculoModal')">×</button></div>
  <div class="form-group"><label class="form-label">Patente</label><input class="form-input" id="vehPatente" placeholder="AB123CD" style="text-transform:uppercase"></div>
  <div class="form-group"><label class="form-label">Modelo</label><input class="form-input" id="vehModelo" placeholder="Ford F-350 2020"></div>
  <div class="form-group">
    <label class="form-label">Vencimiento VTV <small style="color:var(--text2)">(alerta 1 mes antes)</small></label>
    <input class="form-input" id="vehVTV" type="date">
  </div>
  <div class="form-group">
    <label class="form-label">Fecha de cambio de aceite <small style="color:var(--text2)">(alerta a los 6 meses)</small></label>
    <input class="form-input" id="vehAceite" type="date">
  </div>
  <div class="form-group">
    <label class="form-label">Observaciones</label>
    <textarea class="form-input" id="vehObs" rows="3" placeholder="Estado del vehículo, novedades..."></textarea>
  </div>
  <button class="form-btn" id="btnGuardarVehiculo" onclick="guardarVehiculo()">Guardar vehículo</button>
</div>
</div>

<!-- MODAL OBS -->
<div class="modal-bg" id="obsModal">
<div class="modal">
  <div class="modal-title">Agregar Observación <button class="modal-close" onclick="closeModal('obsModal')">×</button></div>
  <div class="form-group"><label class="form-label">Observación</label><textarea class="form-input" id="newObsText" rows="3" placeholder="Describí el problema..."></textarea></div>
  <button class="form-btn" id="btnGuardarObs" onclick="guardarObs()">Guardar observación</button>
</div>
</div>

// ── HELPERS ───────────────────────────────────────────────
function todayStr() {
  const n = new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
}

function dateLabel(str) {
  const [y,m,d] = str.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((date - today) / 86400000);
  if(diff === 0) return 'Hoy';
  if(diff === 1) return 'Mañana';
  if(diff === -1) return 'Ayer';
  return DIAS[date.getDay()]+' '+d+'/'+m;
}

function formatDateEs(str) {
  if(!str) return '-';
  const [y,m,d] = str.split('-');
  return `${d}/${m}/${y}`;
}

window.handleDni = function(v) {
  const user = USERS.find(u => u.dni === v.trim());
  const prevText = document.getElementById('userPreviewText');
  const btn = document.getElementById('loginBtn');
  document.getElementById('loginError').textContent = '';

window.doLogin = function() {
  const v = document.getElementById('dniInput').value.trim();
  const user = USERS.find(u => u.dni === v);
  if(!user) { document.getElementById('loginError').textContent='DNI no encontrado.'; return; }
  currentUser = user;
  localStorage.setItem('metalback_dni', user.dni);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appMain').style.display = 'flex';
  document.getElementById('fabBtn').style.display = 'flex';

  document.getElementById('headerRole').textContent = user.rol;
  selectedDate = todayStr();
  updateDateHero();
  buildDateSelector();
  loadClientes();
  loadVehiculos();
  subscribeToTareas();
  mostrarBotonNotif();
};

window.doLogout = function() {
  if(unsubTareas) unsubTareas();
  currentUser = null;
  localStorage.removeItem('metalback_dni');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appMain').style.display = 'none';
  document.getElementById('fabBtn').style.display = 'none';
  document.getElementById('dniInput').value = '';
  document.getElementById('userPreviewText').textContent = 'Ingresá tu DNI para continuar';

// ── DATE ──────────────────────────────────────────────────
function updateDateHero() {
  const [y,m,d] = selectedDate.split('-').map(Number);
  const date = new Date(y, m-1, d);
  document.getElementById('dayName').textContent = DIAS[date.getDay()];
  document.getElementById('dayNum').textContent = d;
  document.getElementById('dateInfo').textContent = MESES[m-1] + ' de ' + y;
}

function buildDateSelector() {
  const sel = document.getElementById('dateSelector');
  sel.innerHTML = '';
  const now = new Date(); now.setHours(0,0,0,0);
  // Show -1 day to +6 days
  for(let i = -1; i <= 6; i++) {
    const d = new Date(now); d.setDate(now.getDate()+i);
    const val = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const chip = document.createElement('div');
    chip.className = 'date-chip' + (val===selectedDate?' active':'');
    chip.dataset.date = val;
    const label = i===0?'Hoy':i===1?'Mañana':i===-1?'Ayer':DIAS_CORTO[d.getDay()];
    chip.innerHTML = `<span class="chip-day">${label}</span><span class="chip-num">${d.getDate()}</span>`;
    chip.onclick = () => selectDate(val);
    sel.appendChild(chip);
  }
  // scroll to active
  setTimeout(() => {
    const active = sel.querySelector('.date-chip.active');
    if(active) active.scrollIntoView({inline:'center',behavior:'smooth'});
  }, 100);
}

window.selectDate = function(val) {
  selectedDate = val;
  updateDateHero();
  document.querySelectorAll('.date-chip').forEach(c => c.classList.toggle('active', c.dataset.date===val));
  renderTareas();
};

// ── TAREAS ────────────────────────────────────────────────
let tareasAnteriores = null;

function subscribeToTareas() {
  const q = query(collection(db,'tareas'), orderBy('fecha'), orderBy('horario'));
  unsubTareas = onSnapshot(q, snap => {
    const nuevasTareas = snap.docs.map(d => ({id:d.id,...d.data()}));

    // Detectar tareas nuevas de hoy cargadas por OTROS usuarios
    if(tareasAnteriores !== null) {
      const idsAnteriores = new Set(tareasAnteriores.map(t => t.id));
      snap.docChanges().forEach(change => {
        if(change.type === 'added') {
          const t = {id: change.doc.id, ...change.doc.data()};
          if(t.creadoPor !== currentUser.nombre && t.fecha === todayStr()) {
            enviarNotificacion(t);
          }
        }
      });
    }

    tareasAnteriores = nuevasTareas;
    tareas = nuevasTareas;
    renderTareas();
    mostrarBanner();
  });
}

function mostrarBanner() {
  if(Notification.permission !== 'granted') return; // no pisar el banner de activar notif
  const hoy = todayStr();
  const pendientesHoy = tareas.filter(t => t.fecha === hoy && t.estado === 'pendiente');
  const banner = document.getElementById('notifBanner');
  if(pendientesHoy.length > 0) {
    banner.style.display = 'block';
    banner.style.background = '#c0392b';
    banner.onclick = cerrarBanner;
    banner.textContent = `🔴 ${pendientesHoy.length} tarea${pendientesHoy.length>1?'s':''} pendiente${pendientesHoy.length>1?'s':''} para hoy — tocá para ver`;
  } else {
    if(banner.style.background === 'rgb(192, 57, 43)') banner.style.display = 'none';
  }
}

window.cerrarBanner = function() {
  switchTab('tareas');
  selectDate(todayStr());
};

function renderTareas() {
  const container = document.getElementById('taskContainer');
  const filtered = tareas.filter(t => t.fecha === selectedDate);

  // Pendientes / Visto
  const activas = filtered.filter(t => t.estado !== 'realizado').sort((a,b) => (a.horario||'').localeCompare(b.horario||''));
  // Realizadas
  const realizadas = filtered.filter(t => t.estado === 'realizado').sort((a,b) => (a.horario||'').localeCompare(b.horario||''));

  let html = '';

  if(!activas.length && !realizadas.length) {
    html = '<div class="empty-state">Sin tareas para este día<br><small style="margin-top:6px;display:block">Tocá + para agregar una</small></div>';
  } else {
    if(activas.length) {
      html += `<div class="section-label">Pendientes / Visto</div>`;
      html += activas.map(t => renderTaskItem(t)).join('');
    }
    if(realizadas.length) {
      html += `<div class="realizados-section">
        <div class="realizados-toggle" id="realizadosToggle" onclick="toggleRealizados()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          ✅ Realizadas (${realizadas.length})
        </div>
        <div class="realizados-list" id="realizadosList">
          ${realizadas.map(t => renderTaskItem(t)).join('')}
        </div>
      </div>`;
    }
  }

  container.innerHTML = html;
}

function renderTaskItem(t) {
  const estado = t.estado || 'pendiente';
  const esVisto = estado === 'visto';
  const esRealizado = estado === 'realizado';
  const itemClass = esVisto ? 'task-item visto' : esRealizado ? 'task-item realizado' : 'task-item';

  const sobre = t.sobre==='si' ? `Con sobre (${Number(t.monto||0).toLocaleString('es-AR')})` : 'Sin sobre';
  const vehiculo = t.vehiculo ? `🚛 ${t.vehiculo}` : '';
  const hora = t.horario === 'inmediato' ? '⚡' : (t.horario || '--:--');

  let metaLines = [`<span class="task-meta-badge">✍️ ${t.creadoPor}</span>`];
  if(t.vistoBy) metaLines.push(`<span class="task-meta-badge">👁 ${t.vistoBy}</span>`);
  if(t.realizadoBy) metaLines.push(`<span class="task-meta-badge">✅ ${t.realizadoBy}</span>`);

  const btnVisto = `<div class="task-btn visto-btn ${esVisto||esRealizado?'active':''}" onclick="setEstado('${t.id}','${esVisto?'pendiente':'visto'}')" title="${esVisto?'Quitar visto':'Marcar visto'}">👁</div>`;
  const btnRealizado = `<div class="task-btn realizado-btn ${esRealizado?'active':''}" onclick="setEstado('${t.id}','${esRealizado?'visto':'realizado'}')" title="${esRealizado?'Desmarcar':'Marcar realizado'}">✅</div>`;

  return `<div class="${itemClass}">
    <div class="task-time">${hora}</div>
    <div class="task-body">
      <div class="task-client">${t.cliente}</div>
      <div class="task-details">${[vehiculo, sobre].filter(Boolean).join(' · ')}</div>
      <div class="task-meta">${metaLines.join('')}</div>
    </div>
    <div class="task-actions">${btnVisto}${btnRealizado}</div>
  </div>`;
}

window.setEstado = async function(id, nuevoEstado) {
  const updates = { estado: nuevoEstado };
  if(nuevoEstado === 'visto') updates.vistoBy = currentUser.nombre;
  if(nuevoEstado === 'realizado') updates.realizadoBy = currentUser.nombre;
  if(nuevoEstado === 'pendiente') { updates.vistoBy = null; updates.realizadoBy = null; }
  await updateDoc(doc(db,'tareas',id), updates);
};

const VAPID_KEY = 'BHk2ONXWze7NyXqVibC9M3ZvnjETfqWVDGMcyN4Mpx62QmNRoOY6FDQOjes5Xj1gisGmhvE3WeLGT8Dq1EoGO30';
let swRegistration = null;

function mostrarBotonNotif() {
  if(!('Notification' in window)) return;
  if(Notification.permission === 'granted') {
    registrarNotificaciones();
    return;
  }
  if(Notification.permission === 'denied') return;
  // Mostrar banner para activar notificaciones
  const banner = document.getElementById('notifBanner');
  banner.style.display = 'block';
  banner.style.background = '#1a1f2e';
  banner.innerHTML = '🔔 Tocá aquí para activar las notificaciones de nuevas tareas';
  banner.onclick = activarNotificaciones;
}

window.activarNotificaciones = async function() {
  try {
    const permission = await Notification.requestPermission();
    if(permission === 'granted') {
      await registrarNotificaciones();
      const banner = document.getElementById('notifBanner');
      banner.style.background = '#27ae60';
      banner.innerHTML = '✅ Notificaciones activadas';
      banner.onclick = null;
      setTimeout(() => { banner.style.display = 'none'; mostrarBanner(); }, 2000);
    } else {
      document.getElementById('notifBanner').style.display = 'none';
    }
  } catch(e) { console.log('Error activando notificaciones:', e); }
};

async function registrarNotificaciones() {
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    swRegistration = await navigator.serviceWorker.register('/sw.js');
    const sub = await swRegistration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_KEY)
    });
    await setDoc(doc(db, 'suscripciones', currentUser.dni), {
      usuario: currentUser.nombre,
      suscripcion: JSON.stringify(sub),
      updatedAt: serverTimestamp()
    });
  } catch(e) { console.log('Push no disponible:', e.message); }
}

async function enviarNotificacion(tarea) {
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const hora = tarea.horario === 'inmediato' ? '⚡ Inmediatamente' : tarea.horario ? 'a las ' + tarea.horario : '';
    new Notification('📋 Nueva tarea — Metales', {
      body: `${tarea.creadoPor} cargó: ${tarea.cliente} ${hora}`,
      icon: '/icons/icon-192.png',
      badge: '/icons/icon-192.png',
      vibrate: [200, 100, 200]
    });
  } catch(e) { console.log('Error notificación:', e); }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

// ── VEHICULOS ─────────────────────────────────────────────
function isVTVAlert(vtv) {
  if(!vtv) return false;
  const d = new Date(vtv); const now = new Date();
  return (d - now) / (1000*60*60*24) <= 31;
}

function isAceiteAlert(aceite) {
  if(!aceite) return false;
  const d = new Date(aceite); const now = new Date();
  const meses = (now - d) / (1000*60*60*24*30.44);
  return meses >= 6;
}

async function loadVehiculos() {
  onSnapshot(collection(db,'vehiculos'), snap => {
    vehiculos = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderVehiculos();
    populateVehicleSelect();
  });
}

function renderVehiculos() {
  const list = document.getElementById('vehiculosList');
  if(!vehiculos.length) { list.innerHTML='<div class="empty-state">Sin vehículos cargados.</div>'; return; }
  list.innerHTML = vehiculos.map(v => {
    const alertaVTV = isVTVAlert(v.vtv);
    const alertaAceite = isAceiteAlert(v.aceite);
    const vtvCls = alertaVTV ? 'vehicle-meta-item alerta' : 'vehicle-meta-item';
    const aceiteCls = alertaAceite ? 'vehicle-meta-item alerta' : 'vehicle-meta-item';

    // Calcular próximo cambio aceite
    let aceiteInfo = '-';
    if(v.aceite) {
      const cambio = new Date(v.aceite);
      const proximo = new Date(cambio); proximo.setMonth(proximo.getMonth()+6);
      const now = new Date();
      const diasRestantes = Math.round((proximo - now) / (1000*60*60*24));
      const proximoStr = `${String(proximo.getDate()).padStart(2,'0')}/${String(proximo.getMonth()+1).padStart(2,'0')}/${proximo.getFullYear()}`;
      aceiteInfo = alertaAceite
        ? `¡VENCIDO! Próx.: ${proximoStr}`
        : `Próx.: ${proximoStr} (${diasRestantes}d)`;
    }

    const obs = (v.observaciones||[]);
    const obsHtml = obs.length ? obs.slice().reverse().map(o =>
      `<div class="obs-entry"><span class="obs-entry-date">${o.fecha}</span><strong>${o.usuario}:</strong> ${o.texto}</div>`
    ).join('') : '';

    return `<div class="vehicle-card ${alertaVTV||alertaAceite?'alerta-vtv':''}">
      ${alertaVTV||alertaAceite?`<div style="font-size:11px;color:var(--danger);font-weight:600;margin-bottom:8px">⚠ Requiere atención</div>`:''}
      <div class="vehicle-plate">${v.patente}</div>
      <div class="vehicle-model">${v.modelo}</div>
      <div class="vehicle-meta">
        <div class="${vtvCls}"><strong>VTV:</strong> ${formatDateEs(v.vtv)}${alertaVTV?' ⚠':''}</div>
        <div class="${aceiteCls}"><strong>Aceite:</strong> ${aceiteInfo}${alertaAceite?' ⚠':''}</div>
      </div>
      ${obsHtml?`<div class="obs-log">${obsHtml}</div>`:''}
      ${v.obsTexto?`<div style="margin-top:10px;font-size:13px;color:var(--text2);background:var(--surface);padding:8px 10px;border-radius:8px">📝 ${v.obsTexto}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="add-obs-btn" onclick="openObsModal('${v.id}')">+ Agregar obs.</button>
        <button class="add-obs-btn" style="border-color:var(--gold);color:var(--gold)" onclick="actualizarAceite('${v.id}')">🔧 Actualizar aceite</button>
      </div>
    </div>`;
  }).join('');
}

    sel.appendChild(o);
  });
  sel.value = cur;
}

// ── TABS ──────────────────────────────────────────────────
window.switchTab = function(tab) {
  ['tareas','vehiculos'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===tab?'block':'none';
  });
  document.querySelectorAll('.tab').forEach((el,i) => {
    el.classList.toggle('active', ['tareas','vehiculos'][i]===tab);
  });
  document.getElementById('fabBtn').style.display = tab==='tareas'?'flex':'none';
};

// ── MODALES ───────────────────────────────────────────────
window.openModal = function(id) {
  if(id==='tareaModal') {
    document.getElementById('tareaFecha').value = selectedDate;
    populateVehicleSelect();
  }
  document.getElementById(id).classList.add('open');
};
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if(e.target===bg) bg.classList.remove('open'); });
});

</script>

async function precargarClientes() {
  try {
    const apps = getApps();
    const app = apps.length>0?apps[0]:initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const snap = await getDocs(collection(db,'clientes'));
    if(snap.empty) {
      for(const c of CLIENTES_INICIALES) {
        await addDoc(collection(db,'clientes'), {...c, maps:'', createdAt:serverTimestamp()});
      }
    }
  } catch(e) { console.warn('Error precargando clientes:',e); }
}
precargarClientes();
