<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metales</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
:root{
  --dark:#1a1f2e;--mid:#2d3447;--light:#3d4a6b;--accent:#8b9dc3;
  --gold:#c9a84c;--gold-l:#e8c96a;--silver:#d0d6e0;--surface:#f0f2f6;
  --card:#fff;--border:#c5cad8;--text:#1a1f2e;--text2:#5a6380;
  --danger:#b83232;--success:#2a7a4b;--warn:#c97a10;
  --visto-bg:#fffde7;--visto-border:#f0c040;
  --real-bg:#e8f5e9;--real-border:#81c784;
}
body{background:var(--surface);color:var(--text);min-height:100vh;overflow-x:hidden}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--dark) 0%,var(--mid) 60%,var(--light) 100%)}
.logo-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:var(--dark);margin-bottom:1.5rem}
.loading-text{color:var(--silver);font-size:14px;letter-spacing:1px}

.login-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--dark) 0%,var(--mid) 60%,var(--light) 100%);padding:2rem}
.login-logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:var(--dark);margin-bottom:1.5rem;box-shadow:0 4px 24px rgba(201,168,76,.4)}
.login-title{color:#fff;font-size:28px;font-weight:600;letter-spacing:2px;margin-bottom:4px}
.login-sub{color:var(--accent);font-size:13px;letter-spacing:1px;margin-bottom:2.5rem}
.login-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:2rem;width:100%;max-width:360px}
.login-card label{color:var(--silver);font-size:13px;font-weight:500;display:block;margin-bottom:8px;letter-spacing:.5px}
.login-card input{width:100%;padding:13px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:18px;letter-spacing:4px;outline:none;transition:border .2s}
.login-card input:focus{border-color:var(--gold)}
.login-card input::placeholder{color:rgba(255,255,255,.3);letter-spacing:1px;font-size:14px}
.login-preview{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(201,168,76,.13);border:1px solid rgba(201,168,76,.25);color:var(--gold-l);font-size:14px;font-weight:500;min-height:44px;display:flex;align-items:center}
.login-btn{margin-top:1.5rem;width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-l));border:none;font-size:16px;font-weight:600;color:var(--dark);cursor:pointer;transition:opacity .2s}
.login-btn:hover{opacity:.88}
.login-btn:disabled{opacity:.4;cursor:not-allowed}
.login-error{margin-top:12px;color:#f87171;font-size:13px;text-align:center}

.app{display:none;flex-direction:column;min-height:100vh}
.header{background:linear-gradient(90deg,var(--dark),var(--mid));padding:0 1.25rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--dark)}
.header-title{color:#fff;font-size:18px;font-weight:600;letter-spacing:1.5px}
.header-user{color:var(--accent);font-size:12px;text-align:right;line-height:1.4}
.header-user span{display:block;color:var(--gold-l);font-weight:500;font-size:13px}
.logout-btn{background:none;border:1px solid rgba(255,255,255,.15);color:var(--silver);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;margin-left:8px}
.logout-btn:hover{background:rgba(255,255,255,.08)}

.tabs{background:var(--mid);display:flex;border-bottom:2px solid var(--gold)}
.tab{flex:1;padding:12px 4px 10px;text-align:center;color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;letter-spacing:.5px;transition:all .2s;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:18px;height:18px;opacity:.7}
.tab.active{color:var(--gold-l);border-bottom-color:var(--gold)}
.tab.active svg{opacity:1}
.tab:hover{background:rgba(255,255,255,.05)}

.content{flex:1;padding:1rem;max-width:800px;margin:0 auto;width:100%}

.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.75rem 1rem;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.date-nav-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:24px;line-height:1;padding:2px 10px;border-radius:6px;transition:background .15s}
.date-nav-btn:hover{background:var(--surface)}
.date-nav-center{text-align:center;flex:1}
.date-nav-day{font-size:20px;font-weight:700;color:var(--dark);line-height:1.2}
.date-nav-label{font-size:12px;color:var(--text2);margin-top:2px;text-transform:capitalize}

.task-item{border-radius:10px;border:1.5px solid var(--border);margin-bottom:8px;background:#fff;overflow:hidden}
.task-item.visto{background:var(--visto-bg);border-color:var(--visto-border)}
.task-item.realizado{background:var(--real-bg);border-color:var(--real-border)}
.task-main{display:flex;align-items:flex-start;gap:10px;padding:12px 13px}
.task-estado-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:5px;flex-shrink:0}
.task-item.visto .task-estado-dot{background:#f9a825}
.task-item.realizado .task-estado-dot{background:var(--success)}
.task-body{flex:1;min-width:0}
.task-client{font-weight:600;font-size:14px;color:var(--dark)}
.task-details{font-size:12px;color:var(--text2);margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center}
.task-meta{font-size:11px;color:var(--accent);margin-top:5px;line-height:1.6}
.task-meta b{color:var(--text2)}
.task-actions{display:flex;gap:6px;padding:7px 10px;border-top:1px solid rgba(0,0,0,.06);background:rgba(0,0,0,.015);flex-wrap:wrap}
.t-btn{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:7px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .15s;white-space:nowrap}
.t-btn:hover{background:var(--surface)}
.t-btn.visto{border-color:var(--visto-border);color:#7a5c00}
.t-btn.visto:hover{background:var(--visto-bg)}
.t-btn.realizado{border-color:var(--real-border);color:var(--success)}
.t-btn.realizado:hover{background:var(--real-bg)}
.t-btn.del{border-color:#fca5a5;color:var(--danger);margin-left:auto}
.t-btn.del:hover{background:#fef2f2}

.section-sep{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.section-sep::after{content:'';flex:1;height:1px;background:var(--border)}

.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text2);font-size:14px}

.veh-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:10px}
.veh-card.alerta{border-color:var(--danger);background:#fff8f8}
.veh-plate{font-size:20px;font-weight:700;color:var(--dark);letter-spacing:2px}
.veh-model{font-size:13px;color:var(--text2);margin-top:2px}
.veh-meta{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.veh-row{font-size:13px;color:var(--text2);display:flex;align-items:baseline;gap:6px}
.veh-row b{color:var(--text);font-weight:600;min-width:70px}
.veh-row.red{color:var(--danger);font-weight:500}
.veh-row.red b{color:var(--danger)}
.veh-obs-wrap{margin-top:10px;border-top:1px solid #eee;padding-top:8px}
.veh-obs-label{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.veh-obs{font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word;line-height:1.5}

.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));border:none;font-size:28px;color:var(--dark);cursor:pointer;box-shadow:0 4px 16px rgba(201,168,76,.5);z-index:200;display:none;align-items:center;justify-content:center;transition:transform .15s}
.fab:hover{transform:scale(1.07)}

.add-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gold);background:none;border:1.5px dashed var(--gold);padding:9px 16px;border-radius:9px;cursor:pointer;width:100%;justify-content:center;margin-top:8px}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:600;color:var(--dark);margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);line-height:1}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--text2);display:block;margin-bottom:5px;letter-spacing:.3px}
.form-input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;color:var(--text);outline:none;background:#fff;transition:border .2s}
.form-input:focus{border-color:var(--gold)}
.form-select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;color:var(--text);outline:none;background:#fff;transition:border .2s;appearance:none}
.form-select:focus{border-color:var(--gold)}
.form-btn{width:100%;padding:13px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-l));border:none;font-size:15px;font-weight:600;color:var(--dark);cursor:pointer;margin-top:6px}
.form-btn:hover{opacity:.9}
.form-btn:disabled{opacity:.5;cursor:not-allowed}
.form-btn.danger{background:#dc2626;color:#fff;margin-top:8px}

.client-suggestions{border:1.5px solid var(--border);border-radius:9px;background:#fff;margin-top:-10px;margin-bottom:14px;overflow:hidden;display:none;max-height:180px;overflow-y:auto}
.client-sugg-item{padding:10px 13px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.client-sugg-item:last-child{border-bottom:none}
.client-sugg-item:hover{background:var(--surface)}
.sugg-name{font-weight:600;color:var(--dark)}
.sugg-detail{font-size:11px;color:var(--text2);margin-top:1px}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.2);border-top-color:var(--dark);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="logo-circle">M</div>
  <div class="loading-text">Conectando...</div>
</div>

<div class="login-screen" id="loginScreen">
  <div class="login-logo">M</div>
  <div class="login-title">METALES</div>
  <div class="login-sub">SISTEMA DE GESTIÓN INTERNA</div>
  <div class="login-card">
    <label>Ingresá tu DNI</label>
    <input type="number" id="dniInput" placeholder="Ej: 38530754" oninput="handleDni(this.value)">
    <div class="login-preview" id="userPreview">
      <span id="userPreviewText" style="color:rgba(255,255,255,.35)">Ingresá tu DNI para continuar</span>
    </div>
    <button class="login-btn" id="loginBtn" disabled onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="app" id="appMain">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">M</div>
      <div class="header-title">METALES</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <div class="header-user"><span id="headerName">-</span><span id="headerRole">-</span></div>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tbtn-tareas" onclick="switchTab('tareas')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Tareas
    </div>
    <div class="tab" id="tbtn-vehiculos" onclick="switchTab('vehiculos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      Vehículos
    </div>
  </div>

  <div class="content">
    <div id="tab-tareas">
      <div class="date-nav">
        <button class="date-nav-btn" onclick="changeDate(-1)">‹</button>
        <div class="date-nav-center">
          <div class="date-nav-day" id="dateNavDay"></div>
          <div class="date-nav-label" id="dateNavLabel"></div>
        </div>
        <button class="date-nav-btn" onclick="changeDate(1)">›</button>
      </div>
      <div id="tareasActivas"></div>
      <div id="tareasRealizadas"></div>
    </div>

    <div id="tab-vehiculos" style="display:none">
      <div id="vehiculosList"><div class="empty-state">Cargando...</div></div>
      <button class="add-btn" onclick="openNuevoVehiculo()">+ Agregar vehículo</button>
    </div>
  </div>
</div>

<button class="fab" id="fabBtn" onclick="openModal('tareaModal')">+</button>

<!-- MODAL TAREA -->
<div class="modal-bg" id="tareaModal">
<div class="modal">
  <div class="modal-title">Nueva Tarea <button class="modal-close" onclick="closeModal('tareaModal')">×</button></div>
  <div class="form-group">
    <label class="form-label">Cliente</label>
    <input class="form-input" id="tareaCliente" placeholder="Escribí 3+ letras..." oninput="buscarCliente(this.value)" autocomplete="off">
    <div class="client-suggestions" id="clientSuggestions"></div>
  </div>
  <div class="form-group">
    <label class="form-label">Fecha</label>
    <input class="form-input" id="tareaFecha" type="date">
  </div>
  <div class="form-group">
    <label class="form-label">Horario</label>
    <select class="form-select" id="tareaHorarioTipo" onchange="toggleHorario()">
      <option value="inmediato">Inmediatamente</option>
      <option value="especifico">Hora específica</option>
    </select>
  </div>
  <div class="form-group" id="horarioEspGroup" style="display:none">
    <label class="form-label">Hora</label>
    <input class="form-input" id="tareaHorario" type="time">
  </div>
  <div class="form-group">
    <label class="form-label">Vehículo</label>
    <select class="form-select" id="tareaVehiculo">
      <option value="">— Sin vehículo —</option>
      <option value="Camión Grande">Camión Grande</option>
      <option value="Camión Chico">Camión Chico</option>
      <option value="F100">F100</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Sobre</label>
    <select class="form-select" id="tareaSobre" onchange="toggleMonto()">
      <option value="no">Sin sobre</option>
      <option value="si">Con sobre</option>
    </select>
  </div>
  <div class="form-group" id="montoGroup" style="display:none">
    <label class="form-label">Monto</label>
    <input class="form-input" id="tareaMonto" type="number" placeholder="0">
  </div>
  <button class="form-btn" id="btnGuardarTarea" onclick="guardarTarea()">Guardar tarea</button>
</div>
</div>

<!-- MODAL VEHICULO -->
<div class="modal-bg" id="vehiculoModal">
<div class="modal">
  <div class="modal-title" id="vehModalTitle">Nuevo Vehículo <button class="modal-close" onclick="closeModal('vehiculoModal')">×</button></div>
  <div class="form-group"><label class="form-label">Patente</label><input class="form-input" id="vehPatente" placeholder="AB123CD" style="text-transform:uppercase"></div>
  <div class="form-group"><label class="form-label">Modelo</label><input class="form-input" id="vehModelo" placeholder="Ford F-350 2020"></div>
  <div class="form-group"><label class="form-label">Vencimiento VTV</label><input class="form-input" id="vehVTV" type="date"></div>
  <div class="form-group"><label class="form-label">Fecha último cambio de aceite</label><input class="form-input" id="vehAceite" type="date"></div>
  <div class="form-group"><label class="form-label">Observaciones</label><textarea class="form-input" id="vehObs" rows="3" placeholder="Detalles, problemas, notas..."></textarea></div>
  <button class="form-btn" id="btnGuardarVeh" onclick="guardarVehiculo()">Guardar vehículo</button>
  <button class="form-btn danger" id="btnEliminarVeh" onclick="eliminarVehiculo()" style="display:none">Eliminar vehículo</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDGMOeiOio5oVpa6FdLuTI6JxkcwRJTEE",
  authDomain: "metales-empresa.firebaseapp.com",
  projectId: "metales-empresa",
  storageBucket: "metales-empresa.firebasestorage.app",
  messagingSenderId: "1058217936648",
  appId: "1:1058217936648:web:a24bb5d525a9c9815d0ebd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const USERS = [
  {dni:'40715376',nombre:'Camila Barraza',rol:'Jefe'},
  {dni:'38530754',nombre:'Julian Barraza',rol:'Jefe'},
  {dni:'37760794',nombre:'Nicolas Barraza',rol:'Jefe'},
  {dni:'15069827',nombre:'Jaqueline Bernardoni',rol:'Jefe'},
  {dni:'41137174',nombre:'Rocio Alvarez',rol:'Administrativa'},
  {dni:'38634595',nombre:'Joaquin Romero',rol:'Encargado'},
  {dni:'38843842',nombre:'Leandro Ortega',rol:'Encargado'},
  {dni:'38536954',nombre:'Lucas Gimenez',rol:'Encargado'},
  {dni:'6421',nombre:'Metalback',rol:'Jefe'},
];

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

let currentUser = null;
let currentVehId = null;
let currentDate = new Date();
let clientes = [];
let vehiculos = [];
let tareas = [];
let unsubTareas = null;

function dateToStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function strToDate(s) { const [y,m,d] = s.split('-'); return new Date(+y, +m-1, +d); }

// ── INIT ──
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }, 1200);
  document.getElementById('dniInput').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
});

// ── LOGIN ──
window.handleDni = function(v) {
  const user = USERS.find(u => u.dni === v.trim());
  const pt = document.getElementById('userPreviewText');
  const btn = document.getElementById('loginBtn');
  document.getElementById('loginError').textContent = '';
  if(v.length >= 4) {
    if(user) { pt.textContent = user.nombre + ' — ' + user.rol; pt.style.color = ''; btn.disabled = false; }
    else { pt.textContent = 'DNI no registrado'; pt.style.color = '#f87171'; btn.disabled = true; }
  } else { pt.textContent = 'Ingresá tu DNI para continuar'; pt.style.color = 'rgba(255,255,255,.35)'; btn.disabled = true; }
};

window.doLogin = function() {
  const v = document.getElementById('dniInput').value.trim();
  const user = USERS.find(u => u.dni === v);
  if(!user) { document.getElementById('loginError').textContent = 'DNI no encontrado.'; return; }
  currentUser = user;
  currentDate = new Date();
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appMain').style.display = 'flex';
  document.getElementById('fabBtn').style.display = 'flex';
  document.getElementById('headerName').textContent = user.nombre;
  document.getElementById('headerRole').textContent = user.rol;
  updateDateNav();
  loadClientes();
  loadVehiculos();
  subscribeToTareas();
};

window.doLogout = function() {
  if(unsubTareas) unsubTareas();
  currentUser = null;
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appMain').style.display = 'none';
  document.getElementById('fabBtn').style.display = 'none';
  document.getElementById('dniInput').value = '';
  const pt = document.getElementById('userPreviewText');
  pt.textContent = 'Ingresá tu DNI para continuar'; pt.style.color = 'rgba(255,255,255,.35)';
  document.getElementById('loginBtn').disabled = true;
};

// ── DATE NAV ──
function updateDateNav() {
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(currentDate); d.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  document.getElementById('dateNavDay').textContent = currentDate.getDate() + ' de ' + MESES[currentDate.getMonth()];
  let label = DIAS[currentDate.getDay()];
  if(diff === 0) label = 'Hoy · ' + label;
  else if(diff === 1) label = 'Mañana · ' + label;
  else if(diff === -1) label = 'Ayer · ' + label;
  document.getElementById('dateNavLabel').textContent = label;
}

window.changeDate = function(delta) {
  const d = new Date(currentDate);
  d.setDate(d.getDate() + delta);
  currentDate = d;
  updateDateNav();
  renderTareas();
};

// ── TAREAS ──
function subscribeToTareas() {
  const q = query(collection(db, 'tareas'), orderBy('fecha'), orderBy('horario'));
  unsubTareas = onSnapshot(q, snap => {
    tareas = snap.docs.map(d => ({id: d.id, ...d.data()}));
    renderTareas();
  });
}

function renderTareas() {
  const fecha = dateToStr(currentDate);
  const del = tareas.filter(t => t.fecha === fecha);
  const activas = del.filter(t => (t.estado||'pendiente') !== 'realizado');
  const realizadas = del.filter(t => (t.estado||'pendiente') === 'realizado');

  const elA = document.getElementById('tareasActivas');
  const elR = document.getElementById('tareasRealizadas');

  elA.innerHTML = activas.length
    ? activas.map(t => taskCard(t)).join('')
    : '<div class="empty-state">Sin tareas activas para este día</div>';

  elR.innerHTML = realizadas.length
    ? `<div class="section-sep">Realizadas (${realizadas.length})</div>` + realizadas.map(t => taskCard(t)).join('')
    : '';
}

function taskCard(t) {
  const estado = t.estado || (t.done ? 'realizado' : 'pendiente');
  const isPend = estado === 'pendiente';
  const isVisto = estado === 'visto';
  const isReal = estado === 'realizado';
  const cls = isVisto ? 'visto' : isReal ? 'realizado' : '';

  const horText = (!t.horario || t.horario === '') ? 'Inmediatamente' : t.horario;
  const sobreHtml = t.sobre === 'si'
    ? `<span style="color:var(--danger);font-weight:600">${Number(t.monto||0).toLocaleString('es-AR')}</span>`
    : 'sin nada';

  let meta = `Cargado por <b>${t.creadoPor||'-'}</b>`;
  if(t.vistoPor) meta += ` · Visto por <b>${t.vistoPor}</b>`;
  if(t.realizadoPor) meta += ` · Realizado por <b>${t.realizadoPor}</b>`;

  const safe = (t.cliente||'').replace(/'/g,"\\'");
  let btns = '';
  if(isPend) btns += `<button class="t-btn visto" onclick="marcarVisto('${t.id}')">Visto</button>`;
  if(isVisto) btns += `<button class="t-btn realizado" onclick="marcarRealizado('${t.id}')">Realizado</button>`;
  btns += `<button class="t-btn del" onclick="eliminarTarea('${t.id}','${safe}')">Eliminar</button>`;

  return `<div class="task-item ${cls}">
    <div class="task-main">
      <div class="task-estado-dot"></div>
      <div class="task-body">
        <div class="task-client">${t.cliente||''}</div>
        <div class="task-details">
          <span>${horText}</span>
          ${t.vehiculo ? `<span>· ${t.vehiculo}</span>` : ''}
          <span>· ${sobreHtml}</span>
        </div>
        <div class="task-meta">${meta}</div>
      </div>
    </div>
    <div class="task-actions">${btns}</div>
  </div>`;
}

window.marcarVisto = async function(id) {
  await updateDoc(doc(db,'tareas',id), {estado:'visto', vistoPor: currentUser.nombre});
};
window.marcarRealizado = async function(id) {
  await updateDoc(doc(db,'tareas',id), {estado:'realizado', realizadoPor: currentUser.nombre});
};
window.eliminarTarea = async function(id, cliente) {
  if(!confirm(`¿Eliminar la tarea de "${cliente}"?`)) return;
  try { await deleteDoc(doc(db,'tareas',id)); }
  catch(e) { alert('Error: ' + e.message); }
};

// ── FORM TAREA ──
window.toggleHorario = function() {
  document.getElementById('horarioEspGroup').style.display =
    document.getElementById('tareaHorarioTipo').value === 'especifico' ? 'block' : 'none';
};
window.toggleMonto = function() {
  document.getElementById('montoGroup').style.display =
    document.getElementById('tareaSobre').value === 'si' ? 'block' : 'none';
};
window.buscarCliente = function(q) {
  const box = document.getElementById('clientSuggestions');
  if(q.length < 3) { box.style.display = 'none'; return; }
  const res = clientes.filter(c => c.nombre.toLowerCase().includes(q.toLowerCase())).slice(0,8);
  if(!res.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = res.map(c =>
    `<div class="client-sugg-item" onclick="selectCliente('${c.id}')">
      <div class="sugg-name">${c.nombre}</div>
      ${c.tel?`<div class="sugg-detail">${c.tel}</div>`:''}
    </div>`).join('');
};
window.selectCliente = function(id) {
  const c = clientes.find(x => x.id === id);
  if(!c) return;
  document.getElementById('tareaCliente').value = c.nombre;
  document.getElementById('clientSuggestions').style.display = 'none';
};

window.guardarTarea = async function() {
  const cliente = document.getElementById('tareaCliente').value.trim();
  const fecha = document.getElementById('tareaFecha').value;
  if(!cliente) { alert('Ingresá el nombre del cliente.'); return; }
  if(!fecha) { alert('Seleccioná una fecha.'); return; }
  const tipo = document.getElementById('tareaHorarioTipo').value;
  const horario = tipo === 'especifico' ? (document.getElementById('tareaHorario').value || '') : '';
  const btn = document.getElementById('btnGuardarTarea');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Guardando...';
  try {
    await addDoc(collection(db,'tareas'), {
      cliente, horario, fecha,
      vehiculo: document.getElementById('tareaVehiculo').value,
      sobre: document.getElementById('tareaSobre').value,
      monto: document.getElementById('tareaMonto').value || '0',
      estado: 'pendiente',
      creadoPor: currentUser.nombre,
      vistoPor: null, realizadoPor: null,
      createdAt: serverTimestamp()
    });
    closeModal('tareaModal');
    document.getElementById('tareaCliente').value = '';
    document.getElementById('clientSuggestions').style.display = 'none';
    document.getElementById('tareaHorarioTipo').value = 'inmediato';
    document.getElementById('horarioEspGroup').style.display = 'none';
    document.getElementById('tareaHorario').value = '';
    document.getElementById('tareaVehiculo').value = '';
    document.getElementById('tareaSobre').value = 'no';
    document.getElementById('montoGroup').style.display = 'none';
    document.getElementById('tareaMonto').value = '';
    currentDate = strToDate(fecha);
    updateDateNav();
    renderTareas();
  } catch(e) { alert('Error: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Guardar tarea';
};

// ── CLIENTES ──
async function loadClientes() {
  onSnapshot(collection(db,'clientes'), snap => {
    clientes = snap.docs.map(d => ({id: d.id, ...d.data()}));
  });
}

// ── VEHICULOS ──
async function loadVehiculos() {
  onSnapshot(collection(db,'camiones'), snap => {
    vehiculos = snap.docs.map(d => ({id: d.id, ...d.data()}));
    renderVehiculos();
  });
}

function vtvAlerta(s) {
  if(!s || !s.includes('-')) return false;
  return (new Date(s) - new Date()) / (1000*60*60*24) <= 31;
}
function aceiteAlerta(s) {
  if(!s || !s.includes('-')) return false;
  return (new Date() - new Date(s)) / (1000*60*60*24) >= 183;
}
function fmtDate(s) {
  if(!s) return '—';
  const p = s.split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s;
}

function renderVehiculos() {
  const list = document.getElementById('vehiculosList');
  if(!vehiculos.length) { list.innerHTML = '<div class="empty-state">Sin vehículos cargados</div>'; return; }
  list.innerHTML = vehiculos.map(v => {
    const va = vtvAlerta(v.vtv);
    const aa = aceiteAlerta(v.aceite);
    const al = va || aa;
    return `<div class="veh-card ${al?'alerta':''}">
      ${al?'<div style="font-size:11px;color:var(--danger);font-weight:600;margin-bottom:6px">Requiere atención</div>':''}
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div class="veh-plate">${v.patente||''}</div><div class="veh-model">${v.modelo||''}</div></div>
        <button onclick="openEditVehiculo('${v.id}')" style="background:none;border:1.5px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text2)">Editar</button>
      </div>
      <div class="veh-meta">
        <div class="veh-row ${va?'red':''}"><b>VTV</b>${fmtDate(v.vtv)}${va?' — vence pronto':''}</div>
        <div class="veh-row ${aa?'red':''}"><b>Aceite</b>${fmtDate(v.aceite)}${aa?' — hace +6 meses':''}</div>
      </div>
      ${v.obs?`<div class="veh-obs-wrap"><div class="veh-obs-label">Observaciones</div><div class="veh-obs">${v.obs}</div></div>`:''}
    </div>`;
  }).join('');
}

window.openNuevoVehiculo = function() {
  currentVehId = null;
  document.getElementById('vehModalTitle').innerHTML = `Nuevo Vehículo <button class="modal-close" onclick="closeModal('vehiculoModal')">×</button>`;
  ['vehPatente','vehModelo','vehVTV','vehAceite','vehObs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('btnGuardarVeh').textContent = 'Guardar vehículo';
  document.getElementById('btnEliminarVeh').style.display = 'none';
  openModal('vehiculoModal');
};
window.openEditVehiculo = function(id) {
  const v = vehiculos.find(x => x.id === id);
  if(!v) return;
  currentVehId = id;
  document.getElementById('vehModalTitle').innerHTML = `Editar Vehículo <button class="modal-close" onclick="closeModal('vehiculoModal')">×</button>`;
  document.getElementById('vehPatente').value = v.patente || '';
  document.getElementById('vehModelo').value = v.modelo || '';
  document.getElementById('vehVTV').value = v.vtv && v.vtv.includes('-') ? v.vtv : '';
  document.getElementById('vehAceite').value = v.aceite && v.aceite.includes('-') ? v.aceite : '';
  document.getElementById('vehObs').value = v.obs || v.notas || '';
  document.getElementById('btnGuardarVeh').textContent = 'Guardar cambios';
  document.getElementById('btnEliminarVeh').style.display = 'block';
  openModal('vehiculoModal');
};
window.guardarVehiculo = async function() {
  const patente = document.getElementById('vehPatente').value.trim().toUpperCase();
  if(!patente) { alert('Ingresá la patente.'); return; }
  const btn = document.getElementById('btnGuardarVeh');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Guardando...';
  const data = {
    patente,
    modelo: document.getElementById('vehModelo').value.trim(),
    vtv: document.getElementById('vehVTV').value,
    aceite: document.getElementById('vehAceite').value,
    obs: document.getElementById('vehObs').value.trim(),
  };
  try {
    if(currentVehId) { await updateDoc(doc(db,'camiones',currentVehId), data); }
    else { data.createdAt = serverTimestamp(); await addDoc(collection(db,'camiones'), data); }
    closeModal('vehiculoModal'); currentVehId = null;
  } catch(e) { alert('Error: ' + e.message); }
  btn.disabled = false; btn.textContent = currentVehId ? 'Guardar cambios' : 'Guardar vehículo';
};
window.eliminarVehiculo = async function() {
  if(!currentVehId) return;
  const v = vehiculos.find(x => x.id === currentVehId);
  if(!confirm(`¿Eliminar ${v?.patente}?`)) return;
  try { await deleteDoc(doc(db,'camiones',currentVehId)); closeModal('vehiculoModal'); currentVehId = null; }
  catch(e) { alert('Error: ' + e.message); }
};

// ── TABS ──
window.switchTab = function(tab) {
  document.getElementById('tab-tareas').style.display = tab==='tareas'?'block':'none';
  document.getElementById('tab-vehiculos').style.display = tab==='vehiculos'?'block':'none';
  document.getElementById('tbtn-tareas').classList.toggle('active', tab==='tareas');
  document.getElementById('tbtn-vehiculos').classList.toggle('active', tab==='vehiculos');
  document.getElementById('fabBtn').style.display = tab==='tareas'?'flex':'none';
};

// ── MODALES ──
window.openModal = function(id) {
  if(id==='tareaModal') document.getElementById('tareaFecha').value = dateToStr(currentDate);
  document.getElementById(id).classList.add('open');
};
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if(e.target===bg) bg.classList.remove('open'); });
});
</script>
