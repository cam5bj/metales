<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metales</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
:root{
  --metal-dark:#1a1f2e;
  --metal-mid:#2d3447;
  --metal-light:#3d4a6b;
  --metal-accent:#8b9dc3;
  --metal-gold:#c9a84c;
  --metal-gold-light:#e8c96a;
  --metal-silver:#d0d6e0;
  --metal-surface:#f0f2f6;
  --metal-card:#ffffff;
  --metal-border:#c5cad8;
  --metal-text:#1a1f2e;
  --metal-text2:#5a6380;
  --metal-danger:#b83232;
  --metal-success:#2a7a4b;
  --metal-warn:#c97a10;
}
body{background:var(--metal-surface);color:var(--metal-text);min-height:100vh;overflow-x:hidden}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--metal-dark) 0%,var(--metal-mid) 60%,var(--metal-light) 100%)}
.loading-logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--metal-gold),var(--metal-gold-light));display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:var(--metal-dark);margin-bottom:1.5rem}
.loading-text{color:var(--metal-silver);font-size:14px;letter-spacing:1px}

.login-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--metal-dark) 0%,var(--metal-mid) 60%,var(--metal-light) 100%);padding:2rem}
.login-logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--metal-gold),var(--metal-gold-light));display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:var(--metal-dark);margin-bottom:1.5rem;box-shadow:0 4px 24px rgba(201,168,76,0.4)}
.login-title{color:#fff;font-size:28px;font-weight:600;letter-spacing:2px;margin-bottom:4px}
.login-sub{color:var(--metal-accent);font-size:13px;letter-spacing:1px;margin-bottom:2.5rem}
.login-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);border-radius:16px;padding:2rem;width:100%;max-width:360px}
.login-card label{color:var(--metal-silver);font-size:13px;font-weight:500;display:block;margin-bottom:8px;letter-spacing:.5px}
.login-card input{width:100%;padding:13px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-size:18px;letter-spacing:4px;outline:none;transition:border .2s}
.login-card input:focus{border-color:var(--metal-gold)}
.login-card input::placeholder{color:rgba(255,255,255,0.3);letter-spacing:1px;font-size:14px}
.login-user-preview{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(201,168,76,0.13);border:1px solid rgba(201,168,76,0.25);color:var(--metal-gold-light);font-size:14px;font-weight:500;min-height:44px;display:flex;align-items:center;gap:8px}
.login-btn{margin-top:1.5rem;width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--metal-gold),var(--metal-gold-light));border:none;font-size:16px;font-weight:600;color:var(--metal-dark);cursor:pointer;letter-spacing:.5px;transition:opacity .2s}
.login-btn:hover{opacity:.88}
.login-btn:disabled{opacity:.4;cursor:not-allowed}
.login-error{margin-top:12px;color:#f87171;font-size:13px;text-align:center}

.app{display:none;flex-direction:column;min-height:100vh}
.header{background:linear-gradient(90deg,var(--metal-dark),var(--metal-mid));padding:0 1.25rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.25)}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--metal-gold),var(--metal-gold-light));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--metal-dark)}
.header-title{color:#fff;font-size:18px;font-weight:600;letter-spacing:1.5px}
.header-user{color:var(--metal-accent);font-size:12px;text-align:right}
.header-user span{display:block;color:var(--metal-gold-light);font-weight:500;font-size:13px}
.logout-btn{background:none;border:1px solid rgba(255,255,255,0.15);color:var(--metal-silver);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;margin-left:10px}
.logout-btn:hover{background:rgba(255,255,255,0.08)}

.tabs{background:var(--metal-mid);display:flex;border-bottom:2px solid var(--metal-gold)}
.tab{flex:1;padding:13px 4px 11px;text-align:center;color:var(--metal-accent);font-size:12px;font-weight:500;cursor:pointer;letter-spacing:.5px;transition:all .2s;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:18px;height:18px;opacity:.7}
.tab.active{color:var(--metal-gold-light);border-bottom-color:var(--metal-gold)}
.tab.active svg{opacity:1}
.tab:hover{background:rgba(255,255,255,0.05)}

.content{flex:1;padding:1rem;max-width:800px;margin:0 auto;width:100%}

.card{background:var(--metal-card);border:1px solid var(--metal-border);border-radius:14px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card-title{font-size:15px;font-weight:600;color:var(--metal-text);margin-bottom:12px;display:flex;align-items:center;gap:8px}

.date-hero{text-align:center;padding:1.5rem 1rem .5rem}
.date-day-num{font-size:72px;font-weight:700;line-height:1;color:var(--metal-dark)}
.date-info{font-size:16px;color:var(--metal-text2);margin-top:4px}
.date-dayname{font-size:24px;font-weight:600;color:var(--metal-gold);text-transform:capitalize}

.task-item{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:10px;border:1px solid var(--metal-border);margin-bottom:8px;background:#fff}
.task-dot{width:10px;height:10px;border-radius:50%;background:var(--metal-gold);margin-top:4px;flex-shrink:0}
.task-dot.done{background:var(--metal-success)}
.task-body{flex:1}
.task-client{font-weight:600;font-size:14px;color:var(--metal-dark)}
.task-details{font-size:12px;color:var(--metal-text2);margin-top:2px}
.task-meta{font-size:11px;color:var(--metal-accent);margin-top:3px}
.task-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--metal-border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;background:none}
.task-check.done{background:var(--metal-success);border-color:var(--metal-success)}
.task-check.done::after{content:'✓';color:#fff;font-size:13px}

.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--metal-gold),var(--metal-gold-light));border:none;font-size:28px;color:var(--metal-dark);cursor:pointer;box-shadow:0 4px 16px rgba(201,168,76,0.5);z-index:200;display:none;align-items:center;justify-content:center;transition:transform .15s}
.fab:hover{transform:scale(1.07)}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:300;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:600;color:var(--metal-dark);margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--metal-text2);line-height:1}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--metal-text2);display:block;margin-bottom:5px;letter-spacing:.3px}
.form-input{width:100%;padding:11px 13px;border:1.5px solid var(--metal-border);border-radius:9px;font-size:14px;color:var(--metal-text);outline:none;background:#fff;transition:border .2s}
.form-input:focus{border-color:var(--metal-gold)}
.form-select{width:100%;padding:11px 13px;border:1.5px solid var(--metal-border);border-radius:9px;font-size:14px;color:var(--metal-text);outline:none;background:#fff;transition:border .2s;appearance:none}
.form-select:focus{border-color:var(--metal-gold)}
.form-btn{width:100%;padding:13px;border-radius:10px;background:linear-gradient(135deg,var(--metal-gold),var(--metal-gold-light));border:none;font-size:15px;font-weight:600;color:var(--metal-dark);cursor:pointer;margin-top:6px}
.form-btn:hover{opacity:.9}
.form-btn:disabled{opacity:.5;cursor:not-allowed}

.client-suggestions{border:1.5px solid var(--metal-border);border-radius:9px;background:#fff;margin-top:-10px;margin-bottom:14px;overflow:hidden;display:none}
.client-sugg-item{padding:10px 13px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--metal-border)}
.client-sugg-item:last-child{border-bottom:none}
.client-sugg-item:hover{background:var(--metal-surface)}
.client-sugg-name{font-weight:600;color:var(--metal-dark)}
.client-sugg-detail{font-size:11px;color:var(--metal-text2);margin-top:1px}

.sub-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.sub-tab{padding:8px 16px;border-radius:20px;border:1.5px solid var(--metal-border);background:#fff;font-size:13px;font-weight:500;color:var(--metal-text2);cursor:pointer;white-space:nowrap;transition:all .2s}
.sub-tab.active{background:var(--metal-dark);color:var(--metal-gold-light);border-color:var(--metal-dark)}

.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{padding:10px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--metal-text2);letter-spacing:.5px;border-bottom:1.5px solid var(--metal-border);background:var(--metal-surface)}
.data-table td{padding:10px 12px;border-bottom:1px solid #eee;vertical-align:middle}
.data-table tr:hover td{background:#fafbff}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.badge-jefe{background:#e8eefd;color:#2d4a9e}
.badge-admin{background:#e8f8ee;color:#1e6e3d}
.badge-enc{background:#fdf3e2;color:#8a5510}

.truck-card{background:#fff;border:1.5px solid var(--metal-border);border-radius:12px;padding:1rem;margin-bottom:10px;transition:box-shadow .2s}
.truck-card.alerta{border-color:var(--metal-danger);background:#fff8f8}
.truck-plate{font-size:18px;font-weight:700;color:var(--metal-dark);letter-spacing:2px}
.truck-model{font-size:13px;color:var(--metal-text2);margin-top:2px}
.truck-meta{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.truck-meta-item{font-size:12px;color:var(--metal-text2)}
.truck-meta-item strong{color:var(--metal-text);font-weight:600}
.truck-meta-item.vence{color:var(--metal-danger);font-weight:500}
.obs-log{margin-top:10px;border-top:1px solid #eee;padding-top:10px}
.obs-entry{font-size:12px;padding:7px 10px;background:var(--metal-surface);border-radius:7px;margin-bottom:5px}
.obs-entry-date{font-weight:600;color:var(--metal-gold);margin-right:5px}
.add-obs-btn{font-size:12px;color:var(--metal-gold);background:none;border:1px dashed var(--metal-gold);padding:5px 12px;border-radius:8px;cursor:pointer;margin-top:6px}

.asistencia-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.asist-header{font-size:10px;text-align:center;color:var(--metal-text2);font-weight:600;padding:4px 0}
.asist-cell{height:36px;border-radius:7px;border:1.5px solid var(--metal-border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;background:#fff;color:var(--metal-text)}
.asist-cell.present{background:var(--metal-success);border-color:var(--metal-success);color:#fff}
.asist-cell.absent{background:#fce8e8;border-color:var(--metal-danger);color:var(--metal-danger)}
.asist-cell.empty{background:transparent;border-color:transparent;cursor:default}
.asist-cell.future{opacity:.4;cursor:not-allowed}

.client-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--metal-border);border-radius:10px;background:#fff;margin-bottom:8px}
.client-avatar{width:36px;height:36px;border-radius:50%;background:var(--metal-dark);display:flex;align-items:center;justify-content:center;color:var(--metal-gold-light);font-weight:700;font-size:14px;flex-shrink:0}
.client-info{flex:1}
.client-name{font-weight:600;font-size:14px;color:var(--metal-dark)}
.client-detail{font-size:12px;color:var(--metal-text2);margin-top:2px}
.client-link{color:var(--metal-gold);font-size:12px;text-decoration:none;margin-top:2px;display:inline-block}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--metal-text2);font-size:14px}
.section-title{font-size:13px;font-weight:600;color:var(--metal-text2);letter-spacing:.5px;margin:14px 0 8px;text-transform:uppercase}
.pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;margin:3px;background:var(--metal-surface);border:1px solid var(--metal-border);color:var(--metal-text)}
.add-emp-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--metal-gold);background:none;border:1.5px dashed var(--metal-gold);padding:9px 16px;border-radius:9px;cursor:pointer;width:100%;justify-content:center;margin-top:8px}
.emp-select{margin-bottom:12px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,0.2);border-top-color:var(--metal-dark);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-badge{font-size:11px;color:var(--metal-success);display:flex;align-items:center;gap:4px}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">M</div>
  <div class="loading-text">Conectando...</div>
</div>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-logo">M</div>
  <div class="login-title">METALES</div>
  <div class="login-sub">SISTEMA DE GESTIÓN INTERNA</div>
  <div class="login-card">
    <label>Ingresá tu DNI</label>
    <input type="number" id="dniInput" placeholder="Ej: 38530754" oninput="handleDni(this.value)">
    <div class="login-user-preview" id="userPreview">
      <span id="userPreviewText" style="color:rgba(255,255,255,0.35)">Ingresá tu DNI para continuar</span>
    </div>
    <button class="login-btn" id="loginBtn" disabled onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appMain">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">M</div>
      <div class="header-title">METALES</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <div class="header-user"><span id="headerName">-</span><span id="headerRole" style="font-size:11px">-</span></div>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('inicio')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Inicio
    </div>
    <div class="tab" onclick="switchTab('clientes')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Clientes
    </div>
    <div class="tab" onclick="switchTab('empleados')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Empleados
    </div>
    <div class="tab" onclick="switchTab('camiones')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      Camiones
    </div>
  </div>

  <div class="content">
    <!-- INICIO -->
    <div id="tab-inicio">
      <div class="date-hero">
        <div class="date-dayname" id="dayName"></div>
        <div class="date-day-num" id="dayNum"></div>
        <div class="date-info" id="dateInfo"></div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div class="card-title" style="margin:0">Tareas</div>
          <select id="filterFecha" class="form-select" style="width:auto;padding:7px 10px;font-size:12px" onchange="renderTareas()"></select>
        </div>
        <div id="taskList"><div class="empty-state">Cargando tareas...</div></div>
      </div>
    </div>

    <!-- CLIENTES -->
    <div id="tab-clientes" style="display:none">
      <div class="card">
        <div class="card-title">Clientes</div>
        <div id="clientesList"><div class="empty-state">Cargando...</div></div>
        <button class="add-emp-btn" onclick="openModal('clienteModal')">+ Agregar cliente</button>
      </div>
    </div>

    <!-- EMPLEADOS -->
    <div id="tab-empleados" style="display:none">
      <div class="sub-tabs">
        <div class="sub-tab active" onclick="switchSubTab('nomina')">Nómina</div>
        <div class="sub-tab" onclick="switchSubTab('grupo')">Grupos</div>
        <div class="sub-tab" onclick="switchSubTab('asistencia')">Asistencia</div>
      </div>
      <div id="subtab-nomina"></div>
      <div id="subtab-grupo" style="display:none"></div>
      <div id="subtab-asistencia" style="display:none"></div>
    </div>

    <!-- CAMIONES -->
    <div id="tab-camiones" style="display:none">
      <div id="camionesList"><div class="empty-state">Cargando...</div></div>
      <button class="add-emp-btn" onclick="openNuevoCamion()">+ Agregar camión</button>
    </div>
  </div>
</div>

<button class="fab" id="fabBtn" onclick="openModal('tareaModal')">+</button>

<!-- MODAL TAREA -->
<div class="modal-bg" id="tareaModal">
<div class="modal">
  <div class="modal-title">Nueva Tarea <button class="modal-close" onclick="closeModal('tareaModal')">×</button></div>
  <div class="form-group">
    <label class="form-label">Cliente</label>
    <input class="form-input" id="tareaCliente" placeholder="Escribí 3+ letras..." oninput="buscarCliente(this.value)" autocomplete="off">
    <div class="client-suggestions" id="clientSuggestions"></div>
  </div>
  <div class="form-group">
    <label class="form-label">Teléfono</label>
    <input class="form-input" id="tareaTel" placeholder="Teléfono del cliente" readonly>
  </div>
  <div class="form-group">
    <label class="form-label">Dirección</label>
    <input class="form-input" id="tareaDir" placeholder="Dirección" readonly>
  </div>
  <div class="form-group">
    <label class="form-label">Fecha de la tarea</label>
    <input class="form-input" id="tareaFecha" type="date">
  </div>
  <div class="form-group">
    <label class="form-label">Horario</label>
    <input class="form-input" id="tareaHorario" type="time">
  </div>
  <div class="form-group">
    <label class="form-label">Vehículo</label>
    <select class="form-select" id="tareaVehiculo"><option value="">— Sin vehículo —</option></select>
  </div>
  <div class="form-group">
    <label class="form-label">¿Con sobre?</label>
    <select class="form-select" id="tareaSobre" onchange="toggleMonto()">
      <option value="no">Sin sobre</option>
      <option value="si">Con sobre</option>
    </select>
  </div>
  <div class="form-group" id="montoGroup" style="display:none">
    <label class="form-label">Monto del sobre ($)</label>
    <input class="form-input" id="tareaMonto" type="number" placeholder="0.00">
  </div>
  <button class="form-btn" id="btnGuardarTarea" onclick="guardarTarea()">Guardar tarea</button>
</div>
</div>

<!-- MODAL CLIENTE -->
<div class="modal-bg" id="clienteModal">
<div class="modal">
  <div class="modal-title">Nuevo Cliente <button class="modal-close" onclick="closeModal('clienteModal')">×</button></div>
  <div class="form-group"><label class="form-label">Nombre y Apellido</label><input class="form-input" id="cliNombre" placeholder="Juan García"></div>
  <div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" id="cliTel" type="tel" placeholder="11-1234-5678"></div>
  <div class="form-group"><label class="form-label">Dirección</label><input class="form-input" id="cliDir" placeholder="Av. Rivadavia 1234, CABA"></div>
  <div class="form-group"><label class="form-label">Link Google Maps</label><input class="form-input" id="cliMaps" placeholder="https://maps.google.com/..."></div>
  <button class="form-btn" id="btnGuardarCliente" onclick="guardarCliente()">Guardar cliente</button>
</div>
</div>

<!-- MODAL CAMION -->
<div class="modal-bg" id="camionModal">
<div class="modal">
  <div class="modal-title" id="camionModalTitle">Nuevo Camión <button class="modal-close" onclick="closeModal('camionModal')">×</button></div>
  <div class="form-group"><label class="form-label">Patente</label><input class="form-input" id="camPatente" placeholder="AB123CD" style="text-transform:uppercase"></div>
  <div class="form-group"><label class="form-label">Modelo / Descripción</label><input class="form-input" id="camModelo" placeholder="Ford F-350 2020"></div>
  <div class="form-group"><label class="form-label">Vencimiento VTV</label><input class="form-input" id="camVTV" type="date"></div>
  <div class="form-group"><label class="form-label">Vencimiento Patente</label><input class="form-input" id="camPatVenc" type="date"></div>
  <div class="form-group"><label class="form-label">Vencimiento Seguro</label><input class="form-input" id="camSeguro" type="date"></div>
  <div class="form-group"><label class="form-label">Km actuales</label><input class="form-input" id="camKm" type="number" placeholder="0"></div>
  <div class="form-group"><label class="form-label">Próximo cambio aceite (km)</label><input class="form-input" id="camAceite" type="number" placeholder="0"></div>
  <div class="form-group"><label class="form-label">Notas adicionales</label><textarea class="form-input" id="camNotas" rows="2" placeholder="Cualquier detalle extra..."></textarea></div>
  <div class="form-group">
    <label class="form-label">Estado</label>
    <select class="form-select" id="camEstado" onchange="toggleObsInicial()">
      <option value="ok">En condiciones</option>
      <option value="obs">Con observaciones</option>
    </select>
  </div>
  <div id="obsInicialGroup" style="display:none" class="form-group">
    <label class="form-label">Observación inicial</label>
    <textarea class="form-input" id="camObsInicial" rows="2" placeholder="Describí el problema..."></textarea>
  </div>
  <button class="form-btn" id="btnGuardarCamion" onclick="guardarCamion()">Guardar camión</button>
  <button class="form-btn" id="btnEliminarCamion" onclick="eliminarCamion()" style="display:none;background:#dc2626;margin-top:8px">🗑 Eliminar vehículo</button>
</div>
</div>

<!-- MODAL OBS -->
<div class="modal-bg" id="obsModal">
<div class="modal">
  <div class="modal-title">Agregar Observación <button class="modal-close" onclick="closeModal('obsModal')">×</button></div>
  <div class="form-group"><label class="form-label">Observación</label><textarea class="form-input" id="newObsText" rows="3" placeholder="Describí el problema..."></textarea></div>
  <button class="form-btn" id="btnGuardarObs" onclick="guardarObs()">Guardar observación</button>
</div>
</div>

// ── INIT ──────────────────────────────────────────────────
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }, 1200);
  document.getElementById('dniInput').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// ── LOGIN ─────────────────────────────────────────────────
window.handleDni = function(v) {
  const user = USERS.find(u => u.dni === v.trim());
  const prevText = document.getElementById('userPreviewText');
  const btn = document.getElementById('loginBtn');
  document.getElementById('loginError').textContent = '';
  if(v.length >= 8) {
    if(user) { prevText.textContent = user.nombre + ' — ' + user.rol; prevText.style.color = ''; btn.disabled = false; }
    else { prevText.textContent = 'DNI no registrado en el sistema'; prevText.style.color = '#f87171'; btn.disabled = true; }
  } else { prevText.textContent = 'Ingresá tu DNI para continuar'; prevText.style.color = 'rgba(255,255,255,0.35)'; btn.disabled = true; }
};

window.doLogin = function() {
  const v = document.getElementById('dniInput').value.trim();
  const user = USERS.find(u => u.dni === v);
  if(!user) { document.getElementById('loginError').textContent = 'DNI no encontrado.'; return; }
  currentUser = user;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appMain').style.display = 'flex';
  document.getElementById('fabBtn').style.display = 'flex';
  document.getElementById('headerName').textContent = user.nombre;
  document.getElementById('headerRole').textContent = user.rol;
  initDate();
  populateFechaFilter();
  loadClientes();
  loadCamiones();
  subscribeToTareas();
  renderNomina();
};

window.doLogout = function() {
  if(unsubTareas) unsubTareas();
  currentUser = null;
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appMain').style.display = 'none';
  document.getElementById('fabBtn').style.display = 'none';
  document.getElementById('dniInput').value = '';
  document.getElementById('userPreviewText').textContent = 'Ingresá tu DNI para continuar';
  document.getElementById('userPreviewText').style.color = 'rgba(255,255,255,0.35)';
  document.getElementById('loginBtn').disabled = true;
};

// ── FECHA ─────────────────────────────────────────────────
function initDate() {
  const now = new Date();
  document.getElementById('dayName').textContent = DIAS[now.getDay()];
  document.getElementById('dayNum').textContent = now.getDate();
  document.getElementById('dateInfo').textContent = MESES[now.getMonth()] + ' de ' + now.getFullYear();
}

function todayStr() {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
}

function populateFechaFilter() {
  const sel = document.getElementById('filterFecha');
  sel.innerHTML = '';
  const now = new Date();
  for(let i = 0; i < 7; i++) {
    const d = new Date(now); d.setDate(now.getDate() + i);
    const val = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const label = i===0 ? 'Hoy' : (i===1 ? 'Mañana' : DIAS[d.getDay()] + ' ' + d.getDate());
    const opt = document.createElement('option'); opt.value = val; opt.textContent = label;
    sel.appendChild(opt);
  }
  document.getElementById('tareaFecha').value = todayStr();
}

// ── TAREAS (tiempo real) ──────────────────────────────────
function subscribeToTareas() {
  const q = query(collection(db, 'tareas'), orderBy('fecha'), orderBy('horario'));
  unsubTareas = onSnapshot(q, snap => {
    tareas = snap.docs.map(d => ({id: d.id, ...d.data()}));
    renderTareas();
  });
}

window.renderTareas = function() {
  const fecha = document.getElementById('filterFecha').value;
  const list = document.getElementById('taskList');
  const filtered = tareas.filter(t => t.fecha === fecha);
  if(!filtered.length) { list.innerHTML = '<div class="empty-state">Sin tareas para este día</div>'; return; }
  list.innerHTML = filtered.map(t => `
    <div class="task-item">
      <div class="task-dot ${t.done?'done':''}"></div>
      <div class="task-body">
        <div class="task-client">${t.cliente}</div>
        <div class="task-details">${t.horario?t.horario+' · ':''}${t.vehiculo?t.vehiculo+' · ':''}${t.sobre==='si'?'Con sobre ($'+Number(t.monto||0).toLocaleString('es-AR')+')':'Sin sobre'}</div>
        <div class="task-meta">Por ${t.creadoPor}</div>
      </div>
      <div class="task-check ${t.done?'done':''}" onclick="toggleTarea('${t.id}',${!t.done})"></div>
    </div>`).join('');
};

window.toggleTarea = async function(id, done) {
  await updateDoc(doc(db, 'tareas', id), {done});
};

// ── GUARDAR TAREA ─────────────────────────────────────────
window.buscarCliente = function(q) {
  const box = document.getElementById('clientSuggestions');
  if(q.length < 3) { box.style.display = 'none'; return; }
  const res = clientes.filter(c => c.nombre.toLowerCase().includes(q.toLowerCase()));
  if(!res.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = res.map(c => `<div class="client-sugg-item" onclick="selectCliente('${c.id}')"><div class="client-sugg-name">${c.nombre}</div><div class="client-sugg-detail">${c.tel} · ${c.dir}</div></div>`).join('');
};

window.selectCliente = function(id) {
  const c = clientes.find(x => x.id === id);
  if(!c) return;
  document.getElementById('tareaCliente').value = c.nombre;
  document.getElementById('tareaTel').value = c.tel;
  document.getElementById('tareaDir').value = c.dir;
  document.getElementById('clientSuggestions').style.display = 'none';
};

window.toggleMonto = function() {
  document.getElementById('montoGroup').style.display = document.getElementById('tareaSobre').value === 'si' ? 'block' : 'none';
};

window.guardarTarea = async function() {
  const cliente = document.getElementById('tareaCliente').value.trim();
  const fecha = document.getElementById('tareaFecha').value;
  if(!cliente) { alert('Ingresá el nombre del cliente.'); return; }
  if(!fecha) { alert('Seleccioná una fecha.'); return; }
  const btn = document.getElementById('btnGuardarTarea');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Guardando...';
  try {
    await addDoc(collection(db, 'tareas'), {
      cliente,
      horario: document.getElementById('tareaHorario').value,
      vehiculo: document.getElementById('tareaVehiculo').value,
      sobre: document.getElementById('tareaSobre').value,
      monto: document.getElementById('tareaMonto').value,
      fecha,
      creadoPor: currentUser.nombre,
      done: false,
      createdAt: serverTimestamp()
    });
    closeModal('tareaModal');
    ['tareaCliente','tareaTel','tareaDir','tareaHorario','tareaMonto'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('tareaVehiculo').value = '';
    document.getElementById('tareaSobre').value = 'no';
    document.getElementById('montoGroup').style.display = 'none';
    document.getElementById('filterFecha').value = fecha;
  } catch(e) { alert('Error al guardar: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Guardar tarea';
};

// ── CLIENTES ──────────────────────────────────────────────
async function loadClientes() {
  const snap = await getDocs(collection(db, 'clientes'));
  clientes = snap.docs.map(d => ({id: d.id, ...d.data()}));
  renderClientes();
  populateTruckSelect();
  // tiempo real
  onSnapshot(collection(db, 'clientes'), snap => {
    clientes = snap.docs.map(d => ({id: d.id, ...d.data()}));
    renderClientes();
    populateTruckSelect();
  });
}

function renderClientes() {
  const list = document.getElementById('clientesList');
  if(!clientes.length) { list.innerHTML = '<div class="empty-state">Sin clientes cargados.</div>'; return; }
  list.innerHTML = clientes.map(c => {
    const initials = c.nombre.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    return `<div class="client-row">
      <div class="client-avatar">${initials}</div>
      <div class="client-info">
        <div class="client-name">${c.nombre}</div>
        <div class="client-detail">${c.tel||''}${c.dir?' · '+c.dir:''}</div>
        ${c.maps?`<a href="${c.maps}" class="client-link" target="_blank">Ver en Maps</a>`:''}
      </div>
    </div>`;
  }).join('');
}

window.guardarCliente = async function() {
  const nombre = document.getElementById('cliNombre').value.trim();
  if(!nombre) { alert('Ingresá el nombre del cliente.'); return; }
  const btn = document.getElementById('btnGuardarCliente');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Guardando...';
  try {
    await addDoc(collection(db, 'clientes'), {
      nombre,
      tel: document.getElementById('cliTel').value.trim(),
      dir: document.getElementById('cliDir').value.trim(),
      maps: document.getElementById('cliMaps').value.trim(),
      createdAt: serverTimestamp()
    });
    closeModal('clienteModal');
    ['cliNombre','cliTel','cliDir','cliMaps'].forEach(id => document.getElementById(id).value = '');
  } catch(e) { alert('Error al guardar: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Guardar cliente';
};

// ── CAMIONES ──────────────────────────────────────────────
async function loadCamiones() {
  onSnapshot(collection(db, 'camiones'), snap => {
    camiones = snap.docs.map(d => ({id: d.id, ...d.data()}));
    renderCamiones();
    populateTruckSelect();
  });
}

function isAlertDate(s) {
  if(!s) return false;
  const d = new Date(s); const now = new Date();
  return (d - now) / (1000*60*60*24) <= 31;
}
function formatDate(s) { if(!s) return '-'; const[y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }

function renderCamiones() {
  const list = document.getElementById('camionesList');
  if(!camiones.length) { list.innerHTML = '<div class="empty-state">Sin camiones cargados.</div>'; return; }
  list.innerHTML = camiones.map(c => {
    const alerta = isAlertDate(c.vtv) || isAlertDate(c.patVenc) || isAlertDate(c.seguro);
    const vtvCls = isAlertDate(c.vtv) ? 'truck-meta-item vence' : 'truck-meta-item';
    const patCls = isAlertDate(c.patVenc) ? 'truck-meta-item vence' : 'truck-meta-item';
    const segCls = isAlertDate(c.seguro) ? 'truck-meta-item vence' : 'truck-meta-item';
    const obs = (c.observaciones||[]).map(o => `<div class="obs-entry"><span class="obs-entry-date">${o.fecha}</span><strong>${o.usuario}:</strong> ${o.texto}</div>`).join('');
    return `<div class="truck-card ${alerta?'alerta':''}">
      ${alerta?`<div style="font-size:11px;color:var(--metal-danger);font-weight:600;margin-bottom:6px">⚠ Vencimiento próximo</div>`:''}
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="truck-plate">${c.patente}</div>
          <div class="truck-model">${c.modelo}</div>
        </div>
        <button onclick="openEditCamion('${c.id}')" style="background:none;border:1.5px solid var(--metal-border);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--metal-text2)">✏ Editar</button>
      </div>
      <div class="truck-meta">
        <div class="${vtvCls}"><strong>VTV:</strong> ${formatDate(c.vtv)}</div>
        <div class="${patCls}"><strong>Pat:</strong> ${formatDate(c.patVenc)}</div>
        ${c.seguro?`<div class="${segCls}"><strong>Seguro:</strong> ${formatDate(c.seguro)}</div>`:''}
        ${c.km?`<div class="truck-meta-item"><strong>Km:</strong> ${Number(c.km).toLocaleString('es-AR')}</div>`:''}
        ${c.aceite?`<div class="truck-meta-item"><strong>Aceite:</strong> ${Number(c.aceite).toLocaleString('es-AR')} km</div>`:''}
        <div class="truck-meta-item"><strong>Estado:</strong> ${c.estado==='ok'?'En condiciones':'Con observaciones'}</div>
      </div>
      ${c.notas?`<div style="font-size:12px;color:var(--metal-text2);margin-top:6px;padding:6px;background:#f8f8f8;border-radius:6px">📝 ${c.notas}</div>`:''}
      ${(c.observaciones||[]).length?`<div class="obs-log">${obs}</div>`:''}
      <button class="add-obs-btn" onclick="openObsModal('${c.id}')">+ Agregar observación</button>
    </div>`;
  }).join('');
}

window.toggleObsInicial = function() {
  document.getElementById('obsInicialGroup').style.display = document.getElementById('camEstado').value === 'obs' ? 'block' : 'none';
};

window.openEditCamion = function(id) {
  const c = camiones.find(x => x.id === id);
  if(!c) return;
  currentTruckId = id;
  document.getElementById('camionModalTitle').innerHTML = `Editar Vehículo <button class="modal-close" onclick="closeModal('camionModal')">×</button>`;
  document.getElementById('camPatente').value = c.patente || '';
  document.getElementById('camModelo').value = c.modelo || '';
  document.getElementById('camVTV').value = c.vtv || '';
  document.getElementById('camPatVenc').value = c.patVenc || '';
  document.getElementById('camSeguro').value = c.seguro || '';
  document.getElementById('camKm').value = c.km || '';
  document.getElementById('camAceite').value = c.aceite || '';
  document.getElementById('camNotas').value = c.notas || '';
  document.getElementById('camEstado').value = c.estado || 'ok';
  document.getElementById('obsInicialGroup').style.display = 'none';
  document.getElementById('camObsInicial').value = '';
  document.getElementById('btnGuardarCamion').textContent = 'Guardar cambios';
  document.getElementById('btnEliminarCamion').style.display = 'block';
  openModal('camionModal');
};

// Reset modal to "nuevo" mode when opened via the + button
const _origOpenModal = window.openModal;
document.getElementById('camionModal').addEventListener('click', function(){});
document.querySelector('[onclick="openModal(\'camionModal\')"]') && (function(){})();

window.openNuevoCamion = function() {
  currentTruckId = null;
  document.getElementById('camionModalTitle').innerHTML = `Nuevo Camión <button class="modal-close" onclick="closeModal('camionModal')">×</button>`;
  ['camPatente','camModelo','camVTV','camPatVenc','camSeguro','camKm','camAceite','camNotas','camObsInicial'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('camEstado').value = 'ok';
  document.getElementById('obsInicialGroup').style.display = 'none';
  document.getElementById('btnGuardarCamion').textContent = 'Guardar camión';
  document.getElementById('btnEliminarCamion').style.display = 'none';
  openModal('camionModal');
};

window.guardarCamion = async function() {
  const patente = document.getElementById('camPatente').value.trim().toUpperCase();
  const modelo = document.getElementById('camModelo').value.trim();
  if(!patente||!modelo) { alert('Ingresá patente y modelo.'); return; }
  const btn = document.getElementById('btnGuardarCamion');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Guardando...';
  const data = {
    patente, modelo,
    vtv: document.getElementById('camVTV').value,
    patVenc: document.getElementById('camPatVenc').value,
    seguro: document.getElementById('camSeguro').value,
    km: document.getElementById('camKm').value,
    aceite: document.getElementById('camAceite').value,
    notas: document.getElementById('camNotas').value.trim(),
    estado: document.getElementById('camEstado').value,
  };
  try {
    if(currentTruckId) {
      // EDITAR
      await updateDoc(doc(db, 'camiones', currentTruckId), data);
    } else {
      // NUEVO
      const obs = [];
      if(data.estado === 'obs') {
        const t = document.getElementById('camObsInicial').value.trim();
        if(t) {
          const now = new Date();
          obs.push({fecha:`${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`,texto:t,usuario:currentUser.nombre});
        }
      }
      data.observaciones = obs;
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, 'camiones'), data);
    }
    closeModal('camionModal');
    currentTruckId = null;
  } catch(e) { alert('Error al guardar: ' + e.message); }
  btn.disabled = false; btn.textContent = currentTruckId ? 'Guardar cambios' : 'Guardar camión';
};

window.eliminarCamion = async function() {
  if(!currentTruckId) return;
  const c = camiones.find(x => x.id === currentTruckId);
  if(!confirm(`¿Eliminar el vehículo ${c?.patente}? Esta acción no se puede deshacer.`)) return;
  try {
    await deleteDoc(doc(db, 'camiones', currentTruckId));
    closeModal('camionModal');
    currentTruckId = null;
  } catch(e) { alert('Error al eliminar: ' + e.message); }
};

window.openObsModal = function(id) { currentTruckId = id; document.getElementById('newObsText').value = ''; openModal('obsModal'); };

window.guardarObs = async function() {
  const texto = document.getElementById('newObsText').value.trim();
  if(!texto) { alert('Escribí una observación.'); return; }
  const camion = camiones.find(c => c.id === currentTruckId);
  if(!camion) return;
  const btn = document.getElementById('btnGuardarObs');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Guardando...';
  const now = new Date();
  const fecha = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
  const nuevasObs = [...(camion.observaciones||[]), {fecha, texto, usuario: currentUser.nombre}];
  try {
    await updateDoc(doc(db, 'camiones', currentTruckId), {observaciones: nuevasObs, estado: 'obs'});
    closeModal('obsModal');
  } catch(e) { alert('Error: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Guardar observación';
};

function populateTruckSelect() {
  const sel = document.getElementById('tareaVehiculo'); if(!sel) return;
  const cur = sel.value; sel.innerHTML = '<option value="">— Sin vehículo —</option>';
  camiones.forEach(c => { const o = document.createElement('option'); o.value = c.patente; o.textContent = c.patente + ' — ' + c.modelo; sel.appendChild(o); });
  sel.value = cur;
}

// ── EMPLEADOS ─────────────────────────────────────────────
function renderNomina() {
  const badgeClass = {Jefe:'badge-jefe',Administrativa:'badge-admin',Encargado:'badge-enc'};
  document.getElementById('subtab-nomina').innerHTML = `<div class="card" style="overflow-x:auto"><table class="data-table"><thead><tr><th>Nombre</th><th>DNI</th><th>Rol</th></tr></thead><tbody>${
    USERS.map(u=>`<tr><td style="font-weight:500">${u.nombre}</td><td style="font-family:monospace">${u.dni}</td><td><span class="badge ${badgeClass[u.rol]||''}">${u.rol}</span></td></tr>`).join('')
  }</tbody></table></div>`;
}

function renderGrupos() {
  const grupos = {Operario:[],Encargado:USERS.filter(u=>u.rol==='Encargado').map(u=>u.nombre),Prensa:[],Choferes:[]};
  document.getElementById('subtab-grupo').innerHTML = `<div class="card">${
    Object.entries(grupos).map(([g,m])=>`<div class="section-title">${g}</div><div style="margin-bottom:8px">${m.length?m.map(x=>`<span class="pill">${x}</span>`).join(''):'<span style="font-size:13px;color:var(--metal-text2)">Sin miembros</span>'}</div>`).join('')
  }</div>`;
}

function renderAsistencia() {
  const pane = document.getElementById('subtab-asistencia');
  const canEdit = ASISTENCIA_PERMS.includes(currentUser.dni);
  const now = new Date(); const year = now.getFullYear(); const month = now.getMonth();
  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const today = now.getDate();
  const empDni = window._asistEmp || USERS[0].dni;
  let html = `<div class="card"><div class="card-title">Asistencia — ${MESES[month]} ${year}</div>`;
  if(!canEdit) html += `<div style="font-size:12px;color:var(--metal-warn);margin-bottom:10px;padding:8px 12px;background:#fdf8e2;border-radius:8px">Solo los jefes pueden registrar asistencia.</div>`;
  html += `<div class="emp-select"><select class="form-select" id="asistEmp" onchange="changeAsistEmp(this.value)">`;
  USERS.forEach(u => { html += `<option value="${u.dni}" ${u.dni===empDni?'selected':''}>${u.nombre}</option>`; });
  html += `</select></div><div class="asistencia-grid">`;
  ['D','L','M','X','J','V','S'].forEach(d => { html += `<div class="asist-header">${d}</div>`; });
  for(let i=0;i<firstDay;i++) html += `<div class="asist-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++) {
    const key = `${year}-${month}-${empDni}-${d}`;
    const st = asistencia[key];
    const isFuture = d > today;
    let cls = 'asist-cell';
    if(isFuture) cls += ' future';
    else if(st==='P') cls += ' present';
    else if(st==='A') cls += ' absent';
    const click = canEdit&&!isFuture ? `onclick="toggleAsist('${key}')"` : '';
    html += `<div class="${cls}" ${click}>${d}</div>`;
  }
  html += `</div><div style="display:flex;gap:12px;margin-top:14px;font-size:12px">`;
  html += `<span><span style="display:inline-block;width:12px;height:12px;background:var(--metal-success);border-radius:3px;margin-right:4px;vertical-align:middle"></span>Presente</span>`;
  html += `<span><span style="display:inline-block;width:12px;height:12px;background:#fce8e8;border:1.5px solid var(--metal-danger);border-radius:3px;margin-right:4px;vertical-align:middle"></span>Ausente</span>`;
  html += `</div></div>`;
  pane.innerHTML = html;
}

window.changeAsistEmp = function(v) { window._asistEmp = v; renderAsistencia(); };

window.toggleAsist = async function(key) {
  if(!ASISTENCIA_PERMS.includes(currentUser.dni)) return;
  const cur = asistencia[key];
  const next = !cur ? 'P' : cur==='P' ? 'A' : null;
  const docRef = doc(db, 'asistencia', key);
  try {
    if(next) {
      const {setDoc} = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
      await setDoc(docRef, {estado: next, usuario: currentUser.nombre});
      asistencia[key] = next;
    } else {
      const {deleteDoc} = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
      await deleteDoc(docRef);
      delete asistencia[key];
    }
    renderAsistencia();
  } catch(e) { alert('Error: ' + e.message); }
};

async function loadAsistencia() {
  onSnapshot(collection(db, 'asistencia'), snap => {
    asistencia = {};
    snap.docs.forEach(d => { asistencia[d.id] = d.data().estado; });
    if(currentSubTab === 'asistencia') renderAsistencia();
  });
}

// ── TABS ──────────────────────────────────────────────────
window.switchTab = function(tab) {
  ['inicio','clientes','empleados','camiones'].forEach(t => { document.getElementById('tab-'+t).style.display = t===tab?'block':'none'; });
  document.querySelectorAll('.tab').forEach((el,i) => { el.classList.toggle('active', ['inicio','clientes','empleados','camiones'][i]===tab); });
  document.getElementById('fabBtn').style.display = tab==='inicio' ? 'flex' : 'none';
  if(tab==='empleados') { loadAsistencia(); renderSubTab(currentSubTab); }
  if(tab==='camiones') renderCamiones();
  if(tab==='clientes') renderClientes();
};

window.switchSubTab = function(sub) {
  currentSubTab = sub;
  ['nomina','grupo','asistencia'].forEach(s => { document.getElementById('subtab-'+s).style.display = s===sub?'block':'none'; });
  document.querySelectorAll('.sub-tab').forEach((el,i) => { el.classList.toggle('active', ['nomina','grupo','asistencia'][i]===sub); });
  renderSubTab(sub);
};

function renderSubTab(sub) {
  if(sub==='nomina') renderNomina();
  if(sub==='grupo') renderGrupos();
  if(sub==='asistencia') renderAsistencia();
}

// ── MODALES ───────────────────────────────────────────────
window.openModal = function(id) {
  if(id==='tareaModal') { document.getElementById('tareaFecha').value = document.getElementById('filterFecha').value || todayStr(); populateTruckSelect(); }
  document.getElementById(id).classList.add('open');
};
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };
document.querySelectorAll('.modal-bg').forEach(bg => { bg.addEventListener('click', e => { if(e.target===bg) bg.classList.remove('open'); }); });

</script>

async function precargarClientes() {
  try {
    const apps = getApps();
    const app = apps.length > 0 ? apps[0] : initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const snap = await getDocs(collection(db, 'clientes'));
    if (snap.empty) {
      console.log('Precargando ' + CLIENTES_INICIALES.length + ' clientes...');
      for (const c of CLIENTES_INICIALES) {
        await addDoc(collection(db, 'clientes'), { ...c, maps: '', createdAt: serverTimestamp() });
      }
      console.log('Clientes precargados correctamente.');
    } else {
      console.log('Clientes ya existentes en Firebase, no se precargan.');
    }
  } catch(e) {
    console.warn('Error precargando clientes:', e);
  }
}

precargarClientes();
</script>
