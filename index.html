<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Metales</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
:root{
  --dark:#1a1f2e;--mid:#2d3447;--light:#3d4a6b;--accent:#8b9dc3;
  --gold:#c9a84c;--gold-l:#e8c96a;--silver:#d0d6e0;--surface:#f0f2f6;
  --card:#fff;--border:#c5cad8;--text:#1a1f2e;--text2:#5a6380;
  --danger:#b83232;--success:#2a7a4b;
  --pend-bg:#fff;
  --visto-bg:#fffde7;--visto-border:#f0c040;
  --real-bg:#e8f5e9;--real-border:#81c784;
}
body{background:var(--surface);color:var(--text);min-height:100vh}

/* LOADING */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--dark),var(--mid),var(--light))}
.logo-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:var(--dark);margin-bottom:1.5rem}
.loading-text{color:var(--silver);font-size:14px;letter-spacing:1px}

/* PASSWORD */
.pwd-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--dark),var(--mid),var(--light));padding:2rem}

/* LOGIN */
.login-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--dark),var(--mid),var(--light));padding:2rem}
.login-logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:var(--dark);margin-bottom:1.5rem;box-shadow:0 4px 24px rgba(201,168,76,.4)}
.login-title{color:#fff;font-size:28px;font-weight:600;letter-spacing:2px;margin-bottom:4px}
.login-sub{color:var(--accent);font-size:13px;letter-spacing:1px;margin-bottom:2.5rem}
.login-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:2rem;width:100%;max-width:360px}
.login-card label{color:var(--silver);font-size:13px;font-weight:500;display:block;margin-bottom:8px;letter-spacing:.5px}
.login-card input{width:100%;padding:13px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:18px;letter-spacing:4px;outline:none;transition:border .2s}
.login-card input:focus{border-color:var(--gold)}
.login-card input::placeholder{color:rgba(255,255,255,.3);letter-spacing:1px;font-size:14px}
.login-preview{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(201,168,76,.13);border:1px solid rgba(201,168,76,.25);color:var(--gold-l);font-size:14px;font-weight:500;min-height:44px;display:flex;align-items:center}
.login-btn{margin-top:1.5rem;width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-l));border:none;font-size:16px;font-weight:600;color:var(--dark);cursor:pointer;transition:opacity .2s}
.login-btn:hover{opacity:.88}
.login-btn:disabled{opacity:.4;cursor:not-allowed}
.login-error{margin-top:12px;color:#f87171;font-size:13px;text-align:center}

/* APP */
.app{display:none;flex-direction:column;min-height:100vh}
.header{background:linear-gradient(90deg,var(--dark),var(--mid));padding:0 1.25rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--dark)}
.header-title{color:#fff;font-size:18px;font-weight:600;letter-spacing:1.5px}
.header-user{color:var(--accent);font-size:12px;text-align:right;line-height:1.4}
.header-user strong{display:block;color:var(--gold-l);font-size:13px}
.logout-btn{background:none;border:1px solid rgba(255,255,255,.15);color:var(--silver);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;margin-left:8px}
.logout-btn:hover{background:rgba(255,255,255,.08)}

/* TABS PRINCIPALES */
.main-tabs{background:var(--mid);display:flex;border-bottom:2px solid var(--gold)}
.main-tab{flex:1;padding:12px 4px 10px;text-align:center;color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;letter-spacing:.5px;transition:all .2s;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.main-tab svg{width:18px;height:18px;opacity:.7}
.main-tab.active{color:var(--gold-l);border-bottom-color:var(--gold)}
.main-tab.active svg{opacity:1}
.main-tab:hover{background:rgba(255,255,255,.05)}

.content{flex:1;padding:1rem;max-width:800px;margin:0 auto;width:100%}

/* DATE NAV */
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.75rem 1rem}
.date-nav-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:26px;line-height:1;padding:0 10px;border-radius:6px}
.date-nav-btn:hover{background:var(--surface)}
.date-nav-center{text-align:center;flex:1}
.date-nav-day{font-size:20px;font-weight:700;color:var(--dark)}
.date-nav-label{font-size:12px;color:var(--text2);margin-top:2px;text-transform:capitalize}

/* SUB-TABS */
.sub-tabs{display:flex;gap:6px;margin-bottom:12px}
.sub-tab{flex:1;padding:9px 8px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;text-align:center;transition:all .2s}
.sub-tab.active{background:var(--dark);color:var(--gold-l);border-color:var(--dark)}

/* TASKS */
.task-item{position:relative;border-radius:10px;border:1.5px solid var(--border);margin-bottom:8px;background:var(--pend-bg);overflow:hidden}
.task-item.visto{background:var(--visto-bg);border-color:var(--visto-border)}
.task-item.realizado{background:var(--real-bg);border-color:var(--real-border)}
.task-main{display:flex;align-items:flex-start;gap:10px;padding:12px 13px}
.task-dot{width:10px;height:10px;border-radius:50%;background:#aaa;margin-top:5px;flex-shrink:0}
.task-item.visto .task-dot{background:#f9a825}
.task-item.realizado .task-dot{background:var(--success)}
.task-item:not(.visto):not(.realizado) .task-dot{background:var(--gold)}
.task-body{flex:1;min-width:0}
.task-client{font-weight:600;font-size:14px;color:var(--dark);display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.task-details{font-size:12px;color:var(--text2);margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 8px}
.task-clientes-detail{font-size:12px;color:var(--text2);margin-top:5px;display:flex;flex-direction:column;gap:2px}
.task-meta{font-size:11px;color:var(--accent);margin-top:5px;line-height:1.6}
.task-meta b{color:var(--text2)}
.task-realizado-time{position:absolute;top:8px;right:10px;font-size:10px;font-weight:600;color:var(--success);background:rgba(42,122,75,.1);padding:2px 7px;border-radius:8px}
.task-actions{display:flex;gap:6px;padding:7px 10px;border-top:1px solid rgba(0,0,0,.06);background:rgba(0,0,0,.015);flex-wrap:wrap;align-items:center}
.t-btn{display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:7px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .15s;white-space:nowrap}
.t-btn:hover{background:var(--surface)}
.t-btn.visto-btn{border-color:var(--visto-border);color:#7a5c00;background:var(--visto-bg)}
.t-btn.real-btn{border-color:var(--real-border);color:var(--success);background:var(--real-bg)}
.t-btn.edit-btn{border-color:var(--accent);color:var(--dark);background:#fff}
.t-btn.del-btn{border-color:#fca5a5;color:var(--danger);margin-left:auto}
.t-btn.del-btn:hover{background:#fef2f2}

/* PLUS UNO */
.plus-uno-badge{color:var(--success);font-weight:700;font-size:12px;background:rgba(42,122,75,.12);padding:2px 8px;border-radius:10px}
.plus-uno-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 22px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:15px;font-weight:700;color:var(--text2);cursor:pointer;transition:all .15s}
.plus-uno-btn.active{background:var(--success);border-color:var(--success);color:#fff}

/* CLIENTES MULTIPLES EN FORMULARIO */
.cliente-block{border:1.5px solid var(--border);border-radius:9px;padding:10px;margin-bottom:8px;background:var(--surface)}
.cliente-del-btn{background:none;border:1.5px solid #fca5a5;color:var(--danger);border-radius:7px;width:34px;height:34px;font-size:16px;cursor:pointer;flex-shrink:0}
.cliente-del-btn:hover{background:#fef2f2}

/* CHOFER / PATENTE EN TAREA REALIZADA */
.task-realizado-extra{padding:10px 13px;border-top:1px solid rgba(0,0,0,.06);background:rgba(0,0,0,.015);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task-realizado-extra .form-input{flex:1;min-width:120px;padding:8px 10px;font-size:13px}
.task-realizado-extra textarea.form-input{flex:1 1 100%;resize:vertical}

.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text2);font-size:14px}
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--gold);background:none;border:1.5px dashed var(--gold);padding:9px 16px;border-radius:9px;cursor:pointer;width:100%;margin-top:8px}

/* VEHICULOS */
.veh-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:10px}
.veh-card.alerta{border-color:var(--danger);background:#fff8f8}
.veh-plate{font-size:20px;font-weight:700;color:var(--dark);letter-spacing:2px}
.veh-model{font-size:13px;color:var(--text2);margin-top:2px}
.veh-fields{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.veh-field{font-size:13px;color:var(--text2);display:flex;gap:8px}
.veh-field b{color:var(--text);font-weight:600;min-width:65px}
.veh-field.red{color:var(--danger);font-weight:500}
.veh-field.red b{color:var(--danger)}
.veh-obs{margin-top:10px;border-top:1px solid #eee;padding-top:8px;font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word;line-height:1.5}

/* FAB */
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));border:none;font-size:28px;color:var(--dark);cursor:pointer;box-shadow:0 4px 16px rgba(201,168,76,.5);z-index:200;display:none;align-items:center;justify-content:center;transition:transform .15s}
.fab:hover{transform:scale(1.07)}

/* MODALES */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:600;color:var(--dark);margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text2);line-height:1}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--text2);display:block;margin-bottom:5px;letter-spacing:.3px}
.form-input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:16px;color:var(--text);outline:none;background:#fff;transition:border .2s}
.form-input:focus{border-color:var(--gold)}
.form-select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:16px;color:var(--text);outline:none;background:#fff;transition:border .2s;appearance:none}
.form-select:focus{border-color:var(--gold)}
.form-btn{width:100%;padding:13px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-l));border:none;font-size:15px;font-weight:600;color:var(--dark);cursor:pointer;margin-top:6px}
.form-btn:hover{opacity:.9}
.form-btn:disabled{opacity:.5;cursor:not-allowed}
.form-btn.danger{background:#dc2626;color:#fff;margin-top:8px}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.2);border-top-color:var(--dark);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="logo-circle">M</div>
  <div class="loading-text">Cargando...</div>
</div>

<div class="pwd-screen" id="pwdScreen">
  <div class="login-logo">M</div>
  <div class="login-title">METALES</div>
  <div class="login-sub">ACCESO A LA APLICACIÓN</div>
  <div class="login-card">
    <label>Contraseña</label>
    <input type="password" id="pwdInput" placeholder="Ingresá la contraseña" oninput="document.getElementById('pwdError').textContent=''">
    <button class="login-btn" id="pwdBtn" onclick="verificarPassword()">Continuar</button>
    <div class="login-error" id="pwdError"></div>
  </div>
</div>

<div class="login-screen" id="loginScreen">
  <div class="login-logo">M</div>
  <div class="login-title">METALES</div>
  <div class="login-sub">SISTEMA DE GESTIÓN INTERNA</div>
  <div class="login-card">
    <label>Ingresá tu DNI</label>
    <input type="number" id="dniInput" placeholder="Ej: 38530754" oninput="handleDni(this.value)">

    <button class="login-btn" id="loginBtn" disabled onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="app" id="appMain">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">M</div>
      <div class="header-title">METALES</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">

      Tareas

      Vehículos
    </div>
  </div>

  <div class="content">

    <!-- TAREAS -->
    <div id="panel-tareas">
      <div class="date-nav">
        <button class="date-nav-btn" onclick="cambiarFecha(-1)">‹</button>
        <div class="date-nav-center">
          <div class="date-nav-day" id="dateNavDay"></div>
          <div class="date-nav-label" id="dateNavLabel"></div>
        </div>
        <button class="date-nav-btn" onclick="cambiarFecha(1)">›</button>
      </div>
      <div class="sub-tabs">
        <div class="sub-tab active" id="stab-pend" onclick="switchSubTab('pendientes')">Pendientes</div>
        <div class="sub-tab" id="stab-real" onclick="switchSubTab('realizadas')">Realizadas</div>
      </div>
      <div id="listaTareas"></div>

    <!-- VEHICULOS -->
    <div id="panel-vehiculos" style="display:none">

      <button class="add-btn" onclick="abrirNuevoVehiculo()">+ Agregar vehículo</button>
    </div>

  </div>
</div>

<button class="fab" id="fabBtn" onclick="abrirModalTarea()">+</button>

<!-- MODAL TAREA -->
<div class="modal-bg" id="modalTarea">
<div class="modal">
  <div class="modal-title" id="tareaModalTitle">Nueva Tarea <button class="modal-close" onclick="cerrarModal('modalTarea')">×</button></div>

  <div class="form-group">
    <label class="form-label">Clientes</label>
    <div id="tClientesContainer"></div>
    <button type="button" class="add-btn" onclick="agregarClienteForm()">+ Agregar cliente</button>
  </div>

  <div class="form-group">
    <label class="form-label">Fecha</label>
    <input class="form-input" id="tFecha" type="date">
  </div>
  <div class="form-group">
    <label class="form-label">Horario</label>
    <select class="form-select" id="tHorarioTipo" onchange="toggleHorarioInput()">
      <option value="inmediato">Inmediatamente</option>
      <option value="hora">Hora específica</option>
    </select>
  </div>
  <div class="form-group" id="tHorarioInputGroup" style="display:none">
    <label class="form-label">Hora</label>
    <input class="form-input" id="tHorario" type="time">
  </div>
  <div class="form-group">
    <label class="form-label">Vehículo</label>
    <select class="form-select" id="tVehiculo">
      <option value="">— Sin vehículo —</option>
      <option value="Camión Grande">Camión Grande</option>
      <option value="Camión Chico">Camión Chico</option>
      <option value="F100">F100</option>
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">Extra</label>
    <button type="button" class="plus-uno-btn" id="tPlusUnoBtn" onclick="togglePlusUno()">+1</button>
  </div>

  <button class="form-btn" id="btnGuardarTarea" onclick="guardarTarea()">Guardar tarea</button>
</div>
</div>

<!-- MODAL VEHICULO -->
<div class="modal-bg" id="modalVehiculo">
<div class="modal">
  <div class="modal-title" id="vehModalTitle">Nuevo Vehículo <button class="modal-close" onclick="cerrarModal('modalVehiculo')">×</button></div>
  <div class="form-group"><label class="form-label">Patente</label><input class="form-input" id="vPatente" placeholder="AB123CD" style="text-transform:uppercase"></div>
  <div class="form-group"><label class="form-label">Modelo</label><input class="form-input" id="vModelo" placeholder="Ford F-350 2020"></div>
  <div class="form-group"><label class="form-label">Vencimiento VTV</label><input class="form-input" id="vVTV" type="date"></div>

  <div class="form-group"><label class="form-label">Observaciones</label><textarea class="form-input" id="vObs" rows="3" placeholder="Notas, problemas..."></textarea></div>
  <button class="form-btn" id="btnGuardarVeh" onclick="guardarVehiculo()">Guardar vehículo</button>
  <button class="form-btn danger" id="btnEliminarVeh" onclick="eliminarVehiculo()" style="display:none">Eliminar vehículo</button>
</div>
</div>

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

let currentUser = null;
let currentVehId = null;
let subTabActivo = 'pendientes';
let fechaActual = new Date();
let tareas = [];
let vehiculos = [];
let unsubTareas = null;
let idsConocidos = null;

// Estado del formulario de nueva/editar tarea (clientes múltiples + "+1")
let clientesForm = [];
let plusUnoActivo = false;
let tareaEditandoId = null;

// ── UTILS ───────────────────────────────────────────────────
function fechaStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function strAFecha(s) {
  const [y,m,d] = s.split('-');
  return new Date(+y, +m-1, +d);
}
function hoy() { return fechaStr(new Date()); }

function escapeHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function tsToMillis(ts) {
  if(!ts) return 0;
  if(typeof ts.toMillis === 'function') return ts.toMillis();
  if(typeof ts.seconds === 'number') return ts.seconds * 1000;
  return 0;
}
function formatHora(ts) {
  const ms = tsToMillis(ts);
  if(!ms) return '';
  return new Date(ms).toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
}

// ── INIT ────────────────────────────────────────────────────
window.addEventListener('load', () => {
  document.getElementById('dniInput').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('pwdInput').addEventListener('keydown', e => { if(e.key==='Enter') verificarPassword(); });

  const pwdOk = localStorage.getItem('metales_pwd_ok');
  if(!pwdOk) {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('pwdScreen').style.display = 'flex';
    return;
  }
  continuarInicioSesion();
});

function continuarInicioSesion() {
  const dniGuardado = localStorage.getItem('metales_dni');
  if(dniGuardado) {
    const user = USERS.find(u => u.dni === dniGuardado);
    if(user) {
      setTimeout(() => iniciarSesion(user), 800);
      return;
    }
  }
  setTimeout(() => {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }, 800);
}

// ── CONTRASEÑA DE LA APP (solo primera vez por dispositivo) ──
window.verificarPassword = function() {
  const v = document.getElementById('pwdInput').value;
  if(v === APP_PASSWORD) {
    localStorage.setItem('metales_pwd_ok', '1');
    document.getElementById('pwdScreen').style.display = 'none';
    document.getElementById('loadingScreen').style.display = 'flex';
    continuarInicioSesion();
  } else {
    document.getElementById('pwdError').textContent = 'Contraseña incorrecta.';
  }

// ── LOGIN ───────────────────────────────────────────────────
window.handleDni = function(v) {
  const user = USERS.find(u => u.dni === v.trim());
  const txt = document.getElementById('userPreviewText');
  const btn = document.getElementById('loginBtn');
  document.getElementById('loginError').textContent = '';
  if(v.length >= 4) {
    if(user) { txt.textContent = user.nombre + ' — ' + user.rol; txt.style.color = ''; btn.disabled = false; }
    else { txt.textContent = 'DNI no registrado'; txt.style.color = '#f87171'; btn.disabled = true; }
  } else { txt.textContent = 'Ingresá tu DNI para continuar'; txt.style.color = 'rgba(255,255,255,.35)'; btn.disabled = true; }
};

window.doLogin = function() {
  const v = document.getElementById('dniInput').value.trim();
  const user = USERS.find(u => u.dni === v);
  if(!user) { document.getElementById('loginError').textContent = 'DNI no encontrado.'; return; }
  localStorage.setItem('metales_dni', user.dni);
  iniciarSesion(user);
};

function iniciarSesion(user) {
  currentUser = user;
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appMain').style.display = 'flex';
  document.getElementById('fabBtn').style.display = 'flex';
  document.getElementById('headerName').textContent = user.nombre;
  document.getElementById('headerRole').textContent = user.rol;
  fechaActual = new Date();
  actualizarDateNav();
  suscribirTareas();
  cargarVehiculos();

    Notification.requestPermission();
  }
}

window.doLogout = function() {
  localStorage.removeItem('metales_dni');
  if(unsubTareas) unsubTareas();
  currentUser = null;
  idsConocidos = null;
  document.getElementById('appMain').style.display = 'none';
  document.getElementById('fabBtn').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dniInput').value = '';
  const txt = document.getElementById('userPreviewText');
  txt.textContent = 'Ingresá tu DNI para continuar';

// ── DATE NAV ────────────────────────────────────────────────
function actualizarDateNav() {
  const hoyD = new Date(); hoyD.setHours(0,0,0,0);
  const cur = new Date(fechaActual); cur.setHours(0,0,0,0);
  const diff = Math.round((cur - hoyD) / 86400000);
  document.getElementById('dateNavDay').textContent =
    fechaActual.getDate() + ' de ' + MESES[fechaActual.getMonth()];
  let lbl = DIAS[fechaActual.getDay()];
  if(diff === 0) lbl = 'Hoy · ' + lbl;
  else if(diff === 1) lbl = 'Mañana · ' + lbl;
  else if(diff === -1) lbl = 'Ayer · ' + lbl;
  document.getElementById('dateNavLabel').textContent = lbl;
}

window.cambiarFecha = function(delta) {
  fechaActual.setDate(fechaActual.getDate() + delta);
  actualizarDateNav();
  renderTareas();
};

// ── TAREAS ──────────────────────────────────────────────────
function suscribirTareas() {
  const q = query(collection(db, 'tareas'), orderBy('fecha'), orderBy('horario'));
  unsubTareas = onSnapshot(q, snap => {
    const nuevas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(idsConocidos !== null) {
      nuevas.forEach(t => {
        if(!idsConocidos.has(t.id) && t.creadoPor !== currentUser.nombre) {
          notificar(t);
        }
      });
    }
    idsConocidos = new Set(nuevas.map(t => t.id));
    tareas = nuevas;
    renderTareas();
  });
}

function estadoReal(t) {
  if(t.estado) return t.estado;
  if(t.done) return 'realizado';
  return 'pendiente';
}

// Compatibilidad: tareas viejas tienen cliente/sobre/monto sueltos,
// las nuevas tienen un array "clientes"
function getClientesArray(t) {
  if(Array.isArray(t.clientes) && t.clientes.length) return t.clientes;
  return [{ nombre: t.cliente || '', sobre: t.sobre || 'no', monto: t.monto || '0' }];
}

function renderTareas() {
  const fecha = fechaStr(fechaActual);
  const delDia = tareas.filter(t => t.fecha === fecha);
  const pendientes = delDia.filter(t => estadoReal(t) !== 'realizado');
  const realizadas = delDia.filter(t => estadoReal(t) === 'realizado');

  // Ordenar Realizadas por el momento en que se marcaron: la más reciente arriba
  realizadas.sort((a, b) => tsToMillis(b.realizadoAt) - tsToMillis(a.realizadoAt));

  document.getElementById('stab-pend').textContent =
    pendientes.length > 0 ? `Pendientes (${pendientes.length})` : 'Pendientes';
  document.getElementById('stab-real').textContent =
    realizadas.length > 0 ? `Realizadas (${realizadas.length})` : 'Realizadas';

  const lista = subTabActivo === 'pendientes' ? pendientes : realizadas;
  const el = document.getElementById('listaTareas');

  if(!lista.length) {
    el.innerHTML = `<div class="empty-state">${subTabActivo === 'pendientes' ? 'Sin tareas pendientes para este día' : 'Sin tareas realizadas para este día'}</div>`;
    return;
  }
  el.innerHTML = lista.map(t => tarjetaTarea(t)).join('');
}

function tarjetaTarea(t) {
  const estado = estadoReal(t);
  const cls = estado === 'visto' ? 'visto' : estado === 'realizado' ? 'realizado' : '';
  const horText = (!t.horario || t.horario === '') ? 'Inmediatamente' : t.horario;
  const clientesArr = getClientesArray(t);
  const nombresTxt = clientesArr.map(c => c.nombre).filter(Boolean).join(', ') || '-';

  const detalleClientes = clientesArr.map(c => {
    let sobreTxt = 'sin sobre';
    if(c.sobre === 'si') {
      sobreTxt = puedeVerMonto()
        ? `Con sobre: <b style="color:var(--danger)">$${Number(c.monto||0).toLocaleString('es-AR')}</b>`
        : `<b style="color:var(--danger)">Con sobre</b>`;
    }
    return `<div>${escapeHtml(c.nombre || '-')} — ${sobreTxt}</div>`;
  }).join('');

  let meta = `Cargado por <b>${t.creadoPor || '-'}</b>`;
  if(t.vistoPor) meta += ` · Visto por <b>${t.vistoPor}</b>`;
  if(t.realizadoPor) meta += ` · Realizado por <b>${t.realizadoPor}</b>`;

  const idSafe = t.id;
  const nombresSafe = nombresTxt.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

  let acciones = '';
  if(estado === 'pendiente') {
    acciones += `<button class="t-btn visto-btn" onclick="marcarVisto('${idSafe}')">Marcar visto</button>`;
  }
  if(estado === 'visto') {
    acciones += `<button class="t-btn real-btn" onclick="marcarRealizado('${idSafe}')">Marcar realizado</button>`;
  }
  if(estado === 'realizado') {
    acciones += `<button class="t-btn visto-btn" onclick="volverAVisto('${idSafe}')">Volver a visto</button>`;
  }
  if(estado !== 'realizado') {
    acciones += `<button class="t-btn edit-btn" onclick="abrirEditarTarea('${idSafe}')">Editar</button>`;
  }
  acciones += `<button class="t-btn del-btn" onclick="eliminarTarea('${idSafe}','${nombresSafe}')">Eliminar</button>`;

  const horaRealizado = estado === 'realizado' ? formatHora(t.realizadoAt) : '';
  const realizadoTimeBadge = horaRealizado ? `<div class="task-realizado-time">${horaRealizado} hs</div>` : '';

  const realizadoExtra = estado === 'realizado' ? `
    <div class="task-realizado-extra">
      <input class="form-input" placeholder="Chofer" id="chofer-${idSafe}" value="${escapeAttr(t.chofer||'')}">
      <input class="form-input" placeholder="Patente" style="text-transform:uppercase" id="patente-${idSafe}" value="${escapeAttr(t.patente||'')}">
      <textarea class="form-input" placeholder="Observaciones" id="obs-${idSafe}" rows="2">${escapeHtml(t.observaciones||'')}</textarea>
      <button class="t-btn real-btn" onclick="guardarChoferPatente('${idSafe}')">Guardar</button>
    </div>` : '';

  return `<div class="task-item ${cls}">
    ${realizadoTimeBadge}
    <div class="task-main">
      <div class="task-dot"></div>
      <div class="task-body">
        <div class="task-client">${escapeHtml(nombresTxt)}${t.plusUno ? '<span class="plus-uno-badge">+1</span>' : ''}</div>
        <div class="task-details">
          <span>${horText}</span>
          ${t.vehiculo ? `<span>· ${t.vehiculo}</span>` : ''}
        </div>
        <div class="task-clientes-detail">${detalleClientes}</div>
        <div class="task-meta">${meta}</div>
      </div>
    </div>
    ${realizadoExtra}
    <div class="task-actions">${acciones}</div>
  </div>`;
}

};

window.togglePlusUno = function() {

  document.getElementById('tPlusUnoBtn').classList.toggle('active', plusUnoActivo);
};

// ── CLIENTES MÚLTIPLES (formulario nueva/editar tarea) ─────
function nuevoClienteForm() {
  return { nombre: '', sobre: 'no', monto: '' };
}

window.agregarClienteForm = function() {
  clientesForm.push(nuevoClienteForm());
  renderClientesForm();
};

window.eliminarClienteForm = function(idx) {
  clientesForm.splice(idx, 1);
  if(!clientesForm.length) clientesForm.push(nuevoClienteForm());
  renderClientesForm();
};

window.actualizarClienteForm = function(idx, campo, valor) {
  clientesForm[idx][campo] = valor;
  if(campo === 'sobre') renderClientesForm();
};

function renderClientesForm() {
  const el = document.getElementById('tClientesContainer');
  el.innerHTML = clientesForm.map((c, idx) => `
    <div class="cliente-block">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
        <input class="form-input" style="flex:1" placeholder="Nombre del cliente" value="${escapeAttr(c.nombre)}" oninput="actualizarClienteForm(${idx},'nombre',this.value)">
        ${clientesForm.length > 1 ? `<button type="button" class="cliente-del-btn" onclick="eliminarClienteForm(${idx})">×</button>` : ''}
      </div>
      <select class="form-select" onchange="actualizarClienteForm(${idx},'sobre',this.value)">
        <option value="no" ${c.sobre==='no'?'selected':''}>Sin sobre</option>
        <option value="si" ${c.sobre==='si'?'selected':''}>Con sobre</option>
      </select>
      ${c.sobre==='si' ? `<input class="form-input" type="number" placeholder="Monto del sobre" style="margin-top:6px" value="${escapeAttr(c.monto)}" oninput="actualizarClienteForm(${idx},'monto',this.value)">` : ''}
    </div>
  `).join('');
}

window.guardarTarea = async function() {
  const fecha = document.getElementById('tFecha').value;
  if(!fecha) { alert('Seleccioná una fecha.'); return; }

  const clientesValidos = clientesForm
    .map(c => ({
      nombre: (c.nombre || '').trim(),
      sobre: c.sobre === 'si' ? 'si' : 'no',
      monto: c.sobre === 'si' ? (c.monto || '0') : '0'
    }))
    .filter(c => c.nombre);

  if(!clientesValidos.length) { alert('Ingresá al menos un cliente.'); return; }

  const tipo = document.getElementById('tHorarioTipo').value;
  const horario = tipo === 'hora' ? (document.getElementById('tHorario').value || '') : '';
  const btn = document.getElementById('btnGuardarTarea');
  const esEdicion = !!tareaEditandoId;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Guardando...';
  try {
    if(esEdicion) {
      await updateDoc(doc(db, 'tareas', tareaEditandoId), {
        clientes: clientesValidos,
        horario, fecha,
        vehiculo: document.getElementById('tVehiculo').value,
        plusUno: plusUnoActivo
      });
    } else {
      await addDoc(collection(db, 'tareas'), {
        clientes: clientesValidos,
        horario, fecha,
        vehiculo: document.getElementById('tVehiculo').value,
        plusUno: plusUnoActivo,
        estado: 'pendiente',
        creadoPor: currentUser.nombre,
        vistoPor: null,
        realizadoPor: null,
        realizadoAt: null,
        chofer: '',
        patente: '',
        observaciones: '',
        createdAt: serverTimestamp()
      });
    }
    cerrarModal('modalTarea');
    fechaActual = strAFecha(fecha);
    actualizarDateNav();
    switchSubTab('pendientes');
  } catch(e) { alert('Error: ' + e.message); }
  tareaEditandoId = null;
  btn.disabled = false; btn.textContent = 'Guardar tarea';
};

// ── VEHÍCULOS ───────────────────────────────────────────────
function cargarVehiculos() {
  onSnapshot(collection(db, 'camiones'), snap => {
    vehiculos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderVehiculos();
  });
}

function vtvAlerta(s) {
  if(!s) return false;
  return (new Date(s) - new Date()) / 86400000 <= 31;
}
function aceiteAlerta(s) {
  if(!s) return false;
  return (new Date() - new Date(s)) / 86400000 >= 183;
}
function fmtFecha(s) {
  if(!s) return '—';
  const [y,m,d] = s.split('-');
  return d + '/' + m + '/' + y;
}

function renderVehiculos() {
  const el = document.getElementById('listaVehiculos');
  if(!vehiculos.length) { el.innerHTML = '<div class="empty-state">Sin vehículos cargados</div>'; return; }
  el.innerHTML = vehiculos.map(v => {
    const va = vtvAlerta(v.vtv);
    const aa = aceiteAlerta(v.aceite);
    const alerta = va || aa;
    return `<div class="veh-card ${alerta ? 'alerta' : ''}">
      ${alerta ? '<div style="font-size:11px;color:var(--danger);font-weight:600;margin-bottom:6px">Requiere atención</div>' : ''}
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="veh-plate">${v.patente||''}</div>
          <div class="veh-model">${v.modelo||''}</div>
        </div>
        <button onclick="abrirEditarVehiculo('${v.id}')" style="background:none;border:1.5px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text2)">Editar</button>
      </div>
      <div class="veh-fields">
        <div class="veh-field ${va ? 'red' : ''}"><b>VTV</b>${fmtFecha(v.vtv)}${va ? ' — vence pronto' : ''}</div>
        <div class="veh-field ${aa ? 'red' : ''}"><b>Aceite</b>${fmtFecha(v.aceite)}${aa ? ' — hace +6 meses' : ''}</div>
      </div>
      ${v.obs ? `<div class="veh-obs">${v.obs}</div>` : ''}
    </div>`;
  }).join('');
}

window.guardarVehiculo = async function() {
  const patente = document.getElementById('vPatente').value.trim().toUpperCase();
  if(!patente) { alert('Ingresá la patente.'); return; }
  const btn = document.getElementById('btnGuardarVeh');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Guardando...';
  const data = {
    patente,
    modelo: document.getElementById('vModelo').value.trim(),
    vtv: document.getElementById('vVTV').value,
    aceite: document.getElementById('vAceite').value,
    obs: document.getElementById('vObs').value.trim(),
  };
  try {
    if(currentVehId) {
      await updateDoc(doc(db, 'camiones', currentVehId), data);
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, 'camiones'), data);
    }
    cerrarModal('modalVehiculo');
    currentVehId = null;
  } catch(e) { alert('Error: ' + e.message); }
  btn.disabled = false; btn.textContent = currentVehId ? 'Guardar cambios' : 'Guardar vehículo';
};

window.eliminarVehiculo = async function() {
  if(!currentVehId) return;
  const v = vehiculos.find(x => x.id === currentVehId);
  if(!confirm(`¿Eliminar ${v?.patente}?`)) return;
  try {
    await deleteDoc(doc(db, 'camiones', currentVehId));
    cerrarModal('modalVehiculo');
    currentVehId = null;
  } catch(e) { alert('Error: ' + e.message); }
};

// ── TABS ────────────────────────────────────────────────────
window.switchMain = function(tab) {
  document.getElementById('panel-tareas').style.display   = tab === 'tareas'    ? 'block' : 'none';
  document.getElementById('panel-vehiculos').style.display = tab === 'vehiculos' ? 'block' : 'none';
  document.getElementById('mtab-tareas').classList.toggle('active',    tab === 'tareas');
  document.getElementById('mtab-vehiculos').classList.toggle('active', tab === 'vehiculos');
  document.getElementById('fabBtn').style.display = tab === 'tareas' ? 'flex' : 'none';
};

window.switchSubTab = function(tab) {
  subTabActivo = tab;
  document.getElementById('stab-pend').classList.toggle('active', tab === 'pendientes');
  document.getElementById('stab-real').classList.toggle('active', tab === 'realizadas');
  renderTareas();
};

// ── MODALES ─────────────────────────────────────────────────
window.cerrarModal = function(id) { document.getElementById(id).classList.remove('open'); };
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if(e.target === bg) bg.classList.remove('open'); });
});

// ── NOTIFICACIONES ──────────────────────────────────────────
function notificar(t) {
  if(Notification.permission !== 'granted') return;
  const hora = (!t.horario || t.horario === '') ? 'Inmediatamente' : t.horario;
  const nombres = getClientesArray(t).map(c => c.nombre).filter(Boolean).join(', ');
  new Notification('Nueva tarea — Metales', {
    body: `${nombres} · ${hora}${t.vehiculo ? ' · ' + t.vehiculo : ''}\nCargada por ${t.creadoPor}`,
    tag: 'tarea-' + t.id
  });
}
</script>
